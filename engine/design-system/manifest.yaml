# =============================================================================
# manifest.yaml — SỔ ĐĂNG KÝ
#
# File này là chỗ DUY NHẤT khai: component nào thuộc loại nào, luật nằm ở file
# nào, giá trị nằm ở file nào. Compiler VÀ agent đều tra ở đây — không dựa vào
# thứ tự đọc viết bằng văn xuôi (thứ đó drift, đã xảy ra với semantic.json).
#
# Thêm component mới = thêm 1 mục vào `components` + 1 file binding. KHÔNG viết
# luật, trừ khi component đó có suy luận thật sự độc quyền.
#
# version: 2.0-draft
# =============================================================================

meta:
  version: 2.0-draft
  created: "2026-09-08"
  company: GHN
  active_profile: profile.ghn
  status: "[XÁC NHẬN — Williams, cập nhật 2026-09-12]"
  status_note: >
    Toàn bộ nội dung Button (rules/kinds/*, rules/components/button.rules.yaml,
    profile.ghn/policy.yaml § button, profile.ghn/ds/button.binding.yaml) đã
    được Williams xác nhận từng mục — xem tag [XÁC NHẬN — Williams <ngày>] rải
    trong các file đó và profile.ghn/decisions.md. Nhãn "2.0-draft" ở field
    version phía trên chỉ nói kiến trúc còn ít component (mới có Button) và
    còn có thể mở rộng thêm kind/component mới — KHÔNG có nghĩa nội dung hiện
    tại chưa được duyệt.

# -----------------------------------------------------------------------------
# LỚP LUẬT — thứ tự gộp. Sau đè lên trước khi CÙNG rule id (compiler báo lỗi
# nếu 2 kind đè nhau — xem guardrails.conflict_is_error).
# -----------------------------------------------------------------------------
rule_layers:
  - id: core
    file: rules/_core.rules.yaml
    always: true
    provides: [axis_kinds, discipline, universal_a11y, touch_input, contracts]
  - id: foundation
    file: rules/_foundation.rules.yaml
    always: true
    provides: [typography_role, spacing_role, page_background_role, color_role, ux_foundations]
    status: "[XÁC NHẬN — Williams 14/09-B, \"Okay tao đồng ý\"] Layer MỚI — luật dùng nền tảng token (typography/spacing/color/page-background), portable, KHÔNG chọn theo kind/component như 'kinds'/'component' bên dưới — áp dụng cho MỌI component, giống core/composition. Phát sinh từ khảo sát B2B Portal thật (xem profile.ghn/ds/foundation-layout-research.md), đăng ký sau khi đóng hết điểm mở — xem decisions.md § 13/09-U..14/09-B."
  - id: kinds
    dir: rules/kinds
    selected_by: "components.<name>.kinds"
  - id: component
    dir: rules/components
    selected_by: "components.<name> (tuỳ chọn — thường rỗng)"
  - id: composition
    file: rules/_composition.rules.yaml
    always: true
    provides: "luật liên component — chỉ nạp phần dính tới component đang compile"

# -----------------------------------------------------------------------------
# KIỂU TRỤC — định nghĩa ở rules/_core.rules.yaml § axis_kinds
# Component khai trục của mình thuộc kiểu nào; luật cấu trúc theo kiểu tự áp.
# -----------------------------------------------------------------------------
axis_kinds_available:
  - ordered_scale
  - ordered_scale_physical
  - closed_role_set
  - default_plus_exception
  - icon_slots
  - enum
  - scalar_physical

# -----------------------------------------------------------------------------
# LOẠI COMPONENT
# Lằn ranh #1: một kind phải có >= 3 thành viên thật mới được tồn tại.
# `members_planned` là để compiler cảnh báo khi kind chưa đủ thành viên.
# -----------------------------------------------------------------------------
component_kinds:
  interactive_control:
    file: rules/kinds/interactive_control.rules.yaml
    about: "Mọi thứ người dùng bấm/kéo/bật được"
    members_active: [Button]
    members_planned: [Chip, Switch, Slider, Checkbox, Radio]
    requires_axes: [emphasis, size, state]

  action_trigger:
    file: rules/kinds/action_trigger.rules.yaml
    about: "Thứ khi kích hoạt thì THỰC THI một hành động nghiệp vụ"
    members_active: [Button]
    members_planned: [MenuItem, RowAction, LinkButton]
    requires_axes: [intent]

  overlay:
    file: rules/kinds/overlay.rules.yaml
    about: "Nổi lên trên nội dung, chiếm focus"
    members_active: [Dialog, BottomSheet]
    members_planned: [AlertDialog, Popover, ContextMenu]
    status: "[XÁC NHẬN — Williams 12/09] Anatomy (Header/Body slot/Footer) + recipe 'form' đã duyệt từ 12/09-F/G/I/J/L. Dialog đăng ký thành components: chính thức § 12/09-R — xem components.Dialog bên dưới. BottomSheet đăng ký thành components: chính thức § 13/09-F (số liệu width/margin/height thật đã đóng gap còn treo từ OVL-B-04) — xem components.BottomSheet bên dưới. AlertDialog định nghĩa theo nghiệp vụ (§ alert_dialog_trigger trong file kind), chưa có binding riêng."

  feedback_transient:
    file: rules/kinds/feedback_transient.rules.yaml
    about: "Phản hồi không chiếm quyền tương tác — không backdrop, không chặn nền, không bẫy focus"
    about_source: "[XÁC NHẬN — Williams 12/09] 'Okay tao ủng hộ' — thay cho mô tả cũ 'Xuất hiện rồi tự biến mất', vốn chỉ đúng cho Toast (Alert là banner tĩnh, không tự biến mất)"
    members_active: [Toast, Alert]
    members_planned: []
    status: "[ĐỀ XUẤT — Toast+Alert đăng ký 12/09, binding đầu tiên chưa qua verify đầy đủ — xem rules/components/toast.rules.yaml, rules/components/alert.rules.yaml, và profile.ghn/ds/{toast,alert}.binding.yaml § _pending_confirmation"

  form_input:
    file: rules/kinds/form_input.rules.yaml
    about: "Nhận dữ liệu người dùng nhập"
    members_active: [Input]
    members_planned: [Textarea, Select, Combobox, Datepicker]
    requires_axes: [icon_slots]
    status: "[XÁC NHẬN — Williams 12/09] Rule icon đầu tiên (FRMIN-B-01, FRMIN-B-02) đã chốt qua chat, xem rules/kinds/form_input.rules.yaml + decisions.md § 12/09-N. Input đăng ký thành components: chính thức § 12/09-N (Williams: 'Đăng ký ngay') — xem components.Input bên dưới. Vẫn chỉ 1 members_active, dưới ngưỡng cảnh báo guardrails.kind_needs_3_members — chấp nhận tạm thời, cùng khuôn feedback_transient lúc mới có 2 (xem 08/09-D)."

  navigation:
    file: rules/kinds/navigation.rules.yaml
    about: "Điều hướng chính của ứng dụng (menu cấp cao, có thể thu gọn/mở rộng, có active state)"
    members_active: [Sidebar]
    members_planned: []
    status: "[XÁC NHẬN — Williams 13/09-O] Kind MỚI, phát sinh từ khảo sát + build test Sidebar (xem profile.ghn/ds/sidebar-research-notes.md, decisions.md § 13/09-J..O). Chỉ 1 members_active, dưới ngưỡng cảnh báo guardrails.kind_needs_3_members — chấp nhận tạm thời, cùng tiền lệ form_input/overlay lúc mới bắt đầu (xem 08/09-D)."

# -----------------------------------------------------------------------------
# COMPONENT
# -----------------------------------------------------------------------------
components:
  Button:
    kinds: [interactive_control, action_trigger]
    rules: rules/components/button.rules.yaml     # gần rỗng — xem file
    binding: profile.ghn/ds/button.binding.yaml
    policy_scope: button
    examples: examples/button.examples.yaml
    axes:
      intent:    {kind: closed_role_set}
      emphasis:  {kind: ordered_scale}
      shape:     {kind: default_plus_exception}
      size:      {kind: ordered_scale_physical, unit: px}
      state:     {kind: closed_role_set}
      icon:      {kind: icon_slots}

  Toast:
    kinds: [feedback_transient]
    rules: rules/components/toast.rules.yaml
    binding: profile.ghn/ds/toast.binding.yaml     # mặc định = web/desktop
    binding_by_platform:
      mobile: profile.ghn/ds/toast-mobile.binding.yaml
      source: "[XÁC NHẬN — Williams 12/09] 'Làm một bản riêng đánh dấu chỉ xài ở mobile only'"
      note: >
        Component/binding platform-scoped ĐẦU TIÊN trong hệ thống — quyết
        định kiến trúc mới, xem decisions.md 12/09-C. Compiler chọn binding
        theo platform đang build; không khai platform → dùng `binding` mặc
        định (web/desktop).
    policy_scope: toast
    status: "[ĐỀ XUẤT — đăng ký 12/09, xem rules/components/toast.rules.yaml § _pending_confirmation]"
    axes:
      status:          {kind: closed_role_set}
      content_pattern: {kind: enum}

  Alert:
    kinds: [feedback_transient]
    rules: rules/components/alert.rules.yaml
    binding: profile.ghn/ds/alert.binding.yaml
    policy_scope: alert
    status: "[ĐỀ XUẤT — đăng ký 12/09, xem rules/components/alert.rules.yaml § _pending_confirmation]"
    axes:
      status:          {kind: closed_role_set}
      style:           {kind: closed_role_set}
      content_pattern: {kind: enum}

  Input:
    kinds: [form_input]
    rules: rules/components/input.rules.yaml       # gần rỗng — xem file
    binding: profile.ghn/ds/input.binding.yaml
    policy_scope: input
    status: "[XÁC NHẬN — Williams 12/09] Đăng ký chính thức, xem decisions.md § 12/09-N. Nhiều mục giá trị/ý nghĩa nghiệp vụ vẫn [cần verify] — xem rules/components/input.rules.yaml + profile.ghn/ds/input.binding.yaml § _pending_confirmation."
    axes:
      size:        {kind: ordered_scale}
      type:        {kind: closed_role_set}
      destructive: {kind: closed_role_set}
      state:       {kind: closed_role_set}
      icon:        {kind: icon_slots}

  Dialog:
    kinds: [overlay]
    rules: rules/components/dialog.rules.yaml       # gần rỗng — xem file
    binding: profile.ghn/ds/dialog.binding.yaml
    policy_scope: dialog
    status: "[XÁC NHẬN — Williams 12/09] Đăng ký chính thức, xem decisions.md § 12/09-R. Quirk quan trọng: bản mặc định của component gốc dùng Button set CŨ (Type=Grey) — KHÔNG dùng làm chuẩn, xem dialog.binding.yaml § quirks."
    axes:
      content_pattern: {kind: enum}

  BottomSheet:
    kinds: [overlay]
    rules: rules/components/bottomsheet.rules.yaml   # gần rỗng — xem file
    binding: profile.ghn/ds/bottomsheet.binding.yaml
    policy_scope: bottomsheet
    status: "[XÁC NHẬN — Williams 13/09, 'Đóng nốt các gap này đi'] Đăng ký chính thức qua dữ liệu Figma thật (component_set, không phải component đơn như Dialog) — xem decisions.md § 13/09-F. Số liệu width=375px cố định (khớp đúng mobile reference 375px của OVL-B-04), height AUTO/hug theo nội dung (quan sát thật 210px–812px, KHÔNG có cap nhân tạo như Dialog) đã đóng phần 'còn mở' trong dialog.binding.yaml § _pending_confirmation."
    axes:
      content_pattern: {kind: enum}

  Sidebar:
    kinds: [navigation]
    rules: rules/components/sidebar.rules.yaml       # gần rỗng — xem file
    binding: profile.ghn/ds/sidebar.binding.yaml
    policy_scope: sidebar
    status: "[XÁC NHẬN — Williams 13/09-O] Đăng ký chính thức sau khi build test trong Figma (file uFbbdvWYC1dg3AjdnHCgxk) được Williams duyệt qua nhiều vòng sửa (padding, Active-default quirk) — xem decisions.md § 13/09-O. Layout dùng giá trị OVERRIDE riêng của GHN Freight (KHÔNG dùng nguyên default của component thư viện gốc) — xem sidebar.binding.yaml § layout_override. Logo thật (Giao Hàng Nặng) và vài mục nhỏ (numberBadge, chênh lệch chiều cao 48/56px) vẫn [cần verify]."
    axes:
      type:   {kind: closed_role_set}
      state:  {kind: closed_role_set}
      icon:   {kind: icon_slots}

# -----------------------------------------------------------------------------
# GIÁ TRỊ DÙNG CHUNG — mọi component đều nạp
# -----------------------------------------------------------------------------
shared_binding: profile.ghn/ds/_shared.binding.yaml
policy: profile.ghn/policy.yaml
decisions: profile.ghn/decisions.md

# -----------------------------------------------------------------------------
# ĐẦU RA COMPILER
# -----------------------------------------------------------------------------
build:
  dir: build
  resolved: "build/<component>.resolved.yaml"       # agent đọc ĐÚNG file này
  invariants: "build/<component>.invariants.json"   # hàm chấm máy chạy được
  strip_fields:
    reason: "Field chỉ phục vụ người bảo trì — agent không cần để quyết định"
    keys: [source, quote, rationale, correction_of, why_deprecated, superseded_by,
           replaces, absorbs, resolves_open_question, correction_note, retired_ids,
           marker, status, migration_note, leak_direction_note, real_consequence,
           threshold_compliance, measured_nodes, measured_variant_filter,
           measured_on, superseded_naming, layer_contract, profile_contract,
           provenance, component_kind_contract, members_planned, members_active]
  keep_fields:
    reason: "Giữ lại vì LLM cần lý lẽ để áp luật đúng, không chỉ cần lệnh"
    keys: [why, note, test, definition, counter_examples, examples, guard, warning]

  # Lớp GIÁ TRỊ bị strip mạnh tay hơn lớp luật: agent cần biết giá trị LÀ GÌ,
  # không cần biết ai quyết nó, khi nào, và trước đó sai thế nào. Phần đó ở
  # decisions.md. Vẫn giữ lại field mang tính VẬN HÀNH (bẫy đặt tên, điều kiện
  # escalate, status của mục chưa quyết) vì thiếu chúng agent sẽ làm sai thật.
  strip_fields_values:
    keys: [used_by, notable, icon_only_width_note, threshold_compliance,
           finding, problem, real_consequence, handled_by, leak_direction_note,
           risk_noted, vocabulary_decision, superseded, superseded_naming,
           options, tradeoff, recommendation, _pending_migration,
           risk_if_not_done, items_to_move, items_to_drop, why_it_belongs_here,
           accepted_because, known_mismatch, from_threshold, modelling_note,
           reopen_condition, cross_component_note, important_cross_component_note,
           renderer_note, scale_note, class_of_error, verified_by,
           correction_note, full_variant_at, why_no_path, measured_nodes,
           measured_variant_filter, measured_on, legacy_id, confirmed_page_note,
           full_catalog_size, decision, why]
  keep_fields_values:
    reason: "Field vận hành — thiếu là agent làm sai thật, không phải chỉ mất ngữ cảnh"
    keys: [status, semantics, naming_trap, trap, consequence, marker,
           real_condition, escalate_when, matching_note, blocking,
           still_requires_confirm_step, escalate_to_destructive_when,
           name_collision_warning, mitigation, library_filter_warning,
           confirmed_icons, meaning, exception_full_spec, rule]

