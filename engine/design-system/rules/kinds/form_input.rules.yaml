# =============================================================================
# form_input.rules.yaml — LOẠI: NHẬN DỮ LIỆU NGƯỜI DÙNG NHẬP
#
# Thành viên:
#   đang dùng:  (chưa — viết trước khi có binding, giống cách overlay.rules.yaml
#                từng bắt đầu)
#   dự kiến:    Input, Textarea, Select, Combobox, Datepicker
#
# TRẠNG THÁI FILE NÀY: [MỚI 12/09] File trước đó ghi "CHƯA VIẾT" ở
# manifest.yaml § component_kinds.form_input — nay có rule đầu tiên, phát
# sinh từ phiên kiểm chứng UI (render thử Dialog/form dùng Input organism
# thật), Williams tự chủ động sửa cách agent gán icon cho Input.
#
# Đọc _core.rules.yaml trước.
# version: 1.0-draft
# =============================================================================

meta:
  kind: form_input
  layer: kind
  portable: true
  version: 1.0-draft
  requires: [_core.rules.yaml]
  requires_axes: [icon_slots]
  status: "[XÁC NHẬN — Williams 12/09] Rule icon đầu tiên của kind này đã chốt qua chat — xem behavioural_limits"

undisableable: []

# =============================================================================
# GIỚI HẠN HÀNH VI CỦA LOẠI
# =============================================================================
behavioural_limits:
  - id: FRMIN-B-01
    rule: >
      Icon TRÁI (leading icon), KHI ĐƯỢC DÙNG (xem FRMIN-B-03 cho việc có
      dùng hay không): dùng để diễn giải/bổ sung Ý NGHĨA NGỮ CẢNH của field
      đó — vd field số tiền → icon tiền (money-bill). Đây là icon MANG NGHĨA,
      chọn theo ngữ cảnh nghiệp vụ của field cụ thể — KHÔNG phải 1 icon trang
      trí cố định giống nhau cho mọi field, và KHÔNG phải icon demo/leftover
      copy từ ví dụ khác (vd icon phong bì của field "Email" mẫu gốc không
      được giữ lại khi field thật là "Số tiền").
    correction_2026-09-13: >
      [CẬP NHẬT 13/09] Bản gốc (12/09) viết "LUÔN dùng" — ngụ ý MỌI field đều
      phải có icon trái. Williams làm rõ thêm: icon trái là TÙY CHỌN, không
      bắt buộc — xem FRMIN-B-03 (MỚI) cho tiêu chí khi nào dùng/không dùng.
      Rule này (FRMIN-B-01) chỉ còn nói: NẾU có dùng icon trái thì nó phải
      mang nghĩa thật, không phải bắt buộc phải luôn có.
    source: >
      [XÁC NHẬN — Williams 12/09] "Đối với icon quy luật (thêm diễn giải ý
      nghĩa bên trái...)"
    icon_source_discipline: >
      Chọn icon TRÁI qua tra cứu thật (gói FA6 đã cài, hoặc trang Icons
      Figma nếu cần FA6 Pro) — không đoán tên icon từ trí nhớ. Icon MỚI
      (chưa từng dùng trong `_shared.binding.yaml § icon_names`) vẫn cần
      1 người xác nhận qua đúng plugin FA6 Pro trước khi coi là chuẩn cuối
      cùng, cùng kỷ luật đã áp cho icon Button (xem decisions.md 07/09 §
      "Tìm ra trang Icons thật trong file GHN DS").

  - id: FRMIN-B-02
    rule: >
      Icon PHẢI (trailing icon): CHỈ được là ĐÚNG 1 trong 3 giá trị sau,
      LOẠI TRỪ LẪN NHAU — không có icon phải nào khác ngoài 3 case này, và
      khi field không rơi vào case nào thì KHÔNG hiện icon phải:
        1. "clear" (dấu X) — CHỈ hiện khi field đang ở state "pressed".
        2. "chevron-down" — khi field là loại dropdown (Select/Combobox)
           VÀ dropdown đang ở trạng thái ĐÓNG.
        3. "chevron-up" — khi field là loại dropdown VÀ dropdown đang ở
           trạng thái MỞ.
    source: >
      [XÁC NHẬN — Williams 12/09] "đối với icon bên phải chỉ có thể là
      clear khi ở trạng thái pressed hoặc chevron-down nếu nó là dropdown
      đang đóng, chevron-up nếu nó là dropdown đang mở"
    state_mapping: >
      [XÁC NHẬN — Williams 12/09, hỏi lại qua AskUserQuestion] "Trạng thái
      pressed" ánh xạ vào giá trị State=Filled của Input (KHÔNG phải
      State=Focused) — nghĩa là icon "clear" hiện khi field ĐANG CÓ GIÁ TRỊ,
      không cần đang được focus/thao tác trực tiếp.
    icon_literal_mapping: >
      [XÁC NHẬN — Williams 13/09, đổi từ đề xuất ban đầu] "clear" ở trên là
      tên VAI (bằng tiếng Việt/nghĩa), KHÔNG phải tên ligature FA6 thật —
      không có icon nào tên literal "clear" trong catalog FA6. Ligature dùng
      THẬT: `circle-xmark` (bản viên tròn có dấu X — Williams chọn thay cho
      đề xuất ban đầu `xmark` phẳng). Đối chiếu `metadata/icon-families.json`
      gói `@fortawesome/fontawesome-free`, cùng phương pháp đã dùng cho "Bộ
      lọc"→`filter` (xem decisions.md 12/09-A) — `circle-xmark` tồn tại thật
      trong catalog. Vẫn cần 1 người xác nhận qua đúng plugin FA6 Pro trước
      khi coi là chuẩn cuối cùng, giống kỷ luật icon Button — xem
      decisions.md § 13/09-D.
    verified_against_render: >
      [SỬA 12/09-P — bản trước SAI] Bản viết đầu tiên của mục này ghi "áp thử
      2 field demo Số tiền/Diễn giải... khớp đúng rule" — CLAIM NÀY SAI, viết
      mà KHÔNG thật sự đối chiếu lại ảnh render. Khi tự kiểm tra lại (đọc trực
      tiếp componentProperties qua use_figma), phát hiện 2 field đó đang
      dùng SAI slot: icon "money-bill"/"align-left" bị gán vào slot
      `iconClear#489:0` (slot dành riêng cho icon "clear" theo đúng tên) thay
      vì slot `iconLeft#705:0` (đang tắt) — vi phạm trực tiếp FRMIN-B-01 (chưa
      có icon trái mang nghĩa) và FRMIN-B-02 (icon phải không phải "clear").
      ĐÃ SỬA trong file test 12/09-P: bật `iconLeft` = money-bill/align-left,
      sửa `iconClear` từ money-bill/align-left thành `xmark` (giữ bật, đúng vì
      State=Filled). Xem decisions.md § 12/09-P cho đầy đủ. [CẬP NHẬT 13/09]
      `xmark` sau đó đổi thành `circle-xmark` theo yêu cầu Williams — xem
      § icon_literal_mapping ở trên và decisions.md § 13/09-D.

  - id: FRMIN-B-03
    status: "[XÁC NHẬN — Williams 13/09] \"Okay sửa đi\" — đã áp dụng thật lên render Figma demo (xem consequence_on_current_render + decisions.md § 13/09-E)."
    rule: >
      Icon TRÁI (leading icon) KHÔNG bắt buộc phải có ở mọi field — chỉ dùng
      khi field đó đại diện cho 1 KIỂU DỮ LIỆU có icon quy ước, được nhận
      diện rộng rãi (tiền, ngày tháng, số điện thoại, email, phần trăm, địa
      điểm, v.v.). Nếu field là văn bản tự do/mô tả chung chung (không có 1
      kiểu dữ liệu cụ thể gắn với 1 icon quy ước) → KHÔNG dùng icon trái,
      thà để trống còn hơn gắn icon chỉ mang tính trang trí — vi phạm tinh
      thần FRMIN-B-01 (icon phải MANG NGHĨA, không phải trang trí).
    decision_test: >
      Phép thử nhanh: che nhãn (label) của field lại, chỉ nhìn icon — icon
      đó có giúp đoán ĐÚNG loại dữ liệu CỤ THỂ field đang hỏi không (vd nhìn
      money-bill đoán ra "đây là field tiền")? Nếu CÓ → dùng icon trái. Nếu
      icon chỉ truyền đạt được "đây là 1 ô nhập text" một cách chung chung
      (vd align-left dùng cho bất kỳ field mô tả/free-text nào) mà KHÔNG chỉ
      ra được kiểu dữ liệu cụ thể → KHÔNG dùng icon trái cho field đó.
    consequence_on_current_render: >
      Áp phép thử vào 2 field demo: "Số tiền" ĐẠT phép thử (icon money-bill
      đoán đúng ra field tiền) → GIỮ nguyên icon trái money-bill. "Diễn giải"
      KHÔNG đạt phép thử (align-left chỉ nói "đây là ô text", không nói được
      đây là mô tả/diễn giải cụ thể gì) → đã BỎ icon trái của field "Diễn
      giải" (tắt `iconLeft#705:0` qua use_figma trên instance
      `I51:212;67:17577`, giữ nguyên `iconClear#489:0`=circle-xmark). [ĐÃ ÁP
      DỤNG thật lên file test 13/09 — xem decisions.md § 13/09-E, đã chụp lại
      screenshot xác nhận].
    source: >
      [ĐỀ XUẤT 13/09, CHƯA XÁC NHẬN] Trả lời yêu cầu của Williams: "Tuy nhiên
      input có thể có lúc xài icon có lúc không cần xài tao cần mày đề xuất
      tạo ra được quy tắc nào có thể xài icon, khi nào không cần xài icon".
      Xem decisions.md § 13/09-D.
  - id: FRMIN-B-04
    status: "[XÁC NHẬN — Williams 13/09-K]"
    rule: >
      Property `Condition` (hàng chip/tag nhỏ hiển thị bên dưới field, xem
      input.binding.yaml § sub_parts.condition) mặc định TẮT (ẩn) khi dựng
      field mới qua pipeline. CHỈ bật khi có yêu cầu tường minh cần hiện dãy
      điều kiện/tag đó cho field cụ thể.
    source: >
      [XÁC NHẬN — Williams 13/09-K] "lưu ý cái condition bên dưới vùng input
      hầu như tao không dùng tới — nên khi tạo input mày có thể auto ẩn nó đi
      giúp tao". Quan sát thật trên node 23309:4072/4329/4483 (file B2B
      Portal s2NE6ikwLnsZSUp97RBfof) — xem decisions.md § 13/09-K.

