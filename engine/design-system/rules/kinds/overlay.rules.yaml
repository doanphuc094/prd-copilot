# =============================================================================
# overlay.rules.yaml — LOẠI: CHIẾM FOCUS, CHẶN NỀN
#
# Thành viên:
#   đang dùng:  (chưa — viết trước khi có binding, xem _pending_confirmation)
#   dự kiến:    Dialog, AlertDialog, BottomSheet, Popover, ContextMenu
#
# Đây là kind ĐỐI LẬP hành vi với feedback_transient (xem block đầu file đó):
# overlay LUÔN có backdrop, chặn thao tác nền, và (trừ Popover/ContextMenu nhẹ)
# thường bẫy focus tới khi người dùng xử lý xong.
#
# TRẠNG THÁI FILE NÀY: khung sườn — dựa trên bằng chứng gián tiếp
# (_composition.rules.yaml § CMP-DLG-01 đã có từ trước, và draft Dialog/Alert
# Williams paste 08/09). CHƯA đọc trực tiếp cấu trúc Dialog trong Figma — thiếu
# node-id (chỉ có componentKey "Dialog / Dialog oragism" =
# 8b04f4f411eda928c14075725b148bb6a9e5590b, xác nhận là component THẬT, tách
# biệt khỏi Alert, qua search_design_system 12/09). Xem _pending_confirmation.
#
# AlertDialog: tiêu chí kích hoạt đã XÁC NHẬN (12/09, xem § alert_dialog_trigger)
# — modal chặn nền cho thao tác critical, định nghĩa theo NGHIỆP VỤ chứ không
# theo 1 component Figma cụ thể. Binding thật (Figma node, nếu có) vẫn chưa cần
# thiết cho tới khi có màn hình thật cần dùng.
#
# Đọc _core.rules.yaml trước.
# version: 2.0-draft
# =============================================================================

meta:
  kind: overlay
  layer: kind
  portable: true
  version: 2.0-draft
  requires: [_core.rules.yaml]
  requires_axes: [content_pattern]
  status: "[KHUNG SƯỜN — cấu trúc Dialog thật trong Figma chưa đọc được, xem _pending_confirmation]"

undisableable: []

# =============================================================================
# GIỚI HẠN HÀNH VI CỦA LOẠI
# =============================================================================
behavioural_limits:
  - id: OVL-B-01
    rule: "Thành viên của kind này PHẢI có backdrop và chặn thao tác nền, trừ khi profile.policy khai ngoại lệ tường minh cho từng thành viên (vd Popover nhẹ có thể không chặn nền)."
    why: "Đây là ranh giới hành vi phân biệt overlay với feedback_transient."

  - id: OVL-B-02
    rule: "Overlay dùng để bắt buộc xác nhận hành động phá huỷ PHẢI có đúng 2 lối ra: xác nhận và huỷ bỏ — không được chỉ có 1 lối ra (không cho thoát)."
    check: "role == intent.destructive trong CMP-DLG-01 implies count(overlay.exit_actions) >= 2"
    relation_to_composition_rule: "Cụ thể hoá CMP-DLG-01 ở cấp kind — CMP-DLG-01 nói CÓ bước xác nhận, luật này nói bước đó phải cho thoát được."

# =============================================================================
# ALERTDIALOG — tiêu chí kích hoạt (NGHIỆP VỤ, không phải theo component Figma)
#
# [XÁC NHẬN — Williams 12/09] AlertDialog = modal cảnh báo, LUÔN chặn nền,
# dùng cho thao tác CRITICAL: có thể HOẶC không thể khôi phục — nếu khôi phục
# được thì hậu quả vẫn phải RẤT NGHIÊM TRỌNG.
#
# Ví dụ thật (Williams cho): kích hoạt bảng giá. Tại thời điểm kích hoạt, đơn
# hàng bắt đầu tính theo bảng giá mới. Nếu bảng giá sai — về mặt kỹ thuật có
# thể sửa lại (khôi phục được) — nhưng đơn hàng đã lên trong lúc bảng giá sai
# vẫn tính sai doanh thu, ảnh hưởng toàn hệ thống.
#
# ⚠️ ĐIỀU NÀY RỘNG HƠN CMP-DLG-01 hiện có (_composition.rules.yaml): CMP-DLG-01
# viết cho vai intent.destructive (mất dữ liệu / không undo được — xem
# action_trigger.rules.yaml § ATRG-T-01). Ví dụ bảng giá KHÔNG mất dữ liệu,
# KHÔNG phải intent.destructive theo định nghĩa hiện tại — nhưng theo Williams
# vẫn cần chặn nền như Dialog xác nhận phá huỷ. Đây là tiêu chí THỨ HAI, tách
# biệt khỏi tiêu chí phá huỷ — xem _pending_confirmation về việc có cần mở rộng
# CMP-DLG-01 hay thêm 1 rule composition mới song song.
# =============================================================================
alert_dialog_trigger:
  decides: "member == AlertDialog"
  axis_kind: closed_role_set
  ask: >
    Hành động này có phải loại CRITICAL không: (a) không thể khôi phục, HOẶC
    (b) khôi phục được nhưng hậu quả nghiêm trọng, ảnh hưởng diện rộng (nhiều
    người dùng / nhiều hệ thống / số liệu tài chính)?
  trigger_confirmed:
    - case: "Không thể khôi phục"
      relation: "Trùng ATRG-T-01 (intent.destructive) — dùng chung với Dialog recipe 'confirmation'"
    - case: "Khôi phục được nhưng hậu quả nghiêm trọng, diện rộng"
      relation: "MỚI — không nằm trong ATRG-T-01 hiện tại, xem _pending_confirmation"
      example: "[XÁC NHẬN — Williams 12/09] Kích hoạt bảng giá sai → đơn hàng tính sai doanh thu toàn hệ thống, dù bảng giá có thể sửa lại được"
  fallback:
    action: escalate
    message: >
      Không xác định được mức độ nghiêm trọng của hậu quả từ tài liệu nghiệp
      vụ. Cần designer/business xác nhận — KHÔNG tự đánh giá "nghiêm trọng"
      bằng trực giác.

# =============================================================================
# CONTENT PATTERN — Dialog không có 1 anatomy cố định (ghi nhận từ draft
# Williams 08/09: "Dialog không có fixed anatomy" — decision_log gốc)
# =============================================================================
content_pattern:
  decides: content_pattern
  axis_kind: enum
  ask: "Nội dung bên trong overlay này khớp catalogued recipe nào?"
  known_recipes:
    - id: confirmation
      about: "Xác nhận 1 hành động trước khi thực thi — thường đi kèm CMP-DLG-01"
      evidence: "[FIGMA] node 773:12361 / 773:12382 — draft Williams 08/09"
      status: "[XÁC NHẬN — có evidence node, chưa re-verify trực tiếp trong phiên này]"
    - id: form
      about: "Overlay chứa 1 form nhập liệu ngắn"
      evidence: "KHÔNG CÓ — draft Williams 08/09 liệt kê nhưng chưa có node minh chứng"
      status: "[cần verify — chưa có bằng chứng Figma]"
  not_in_table:
    rule: "Nội dung không khớp recipe nào đã catalogued → escalate, KHÔNG tự bịa cấu trúc mới cho Dialog."
    why: "Dialog không có anatomy cố định — đây là lý do CÀNG phải catalogue recipe thay vì suy luận tự do."

# =============================================================================
# INVARIANTS của loại
# =============================================================================
invariants:
  - id: OVL-INV-01
    rule: "Overlay PHẢI có ít nhất 1 hành động thoát ra tường minh (đóng / huỷ / hoàn thành)."
    status: "[cần verify phạm vi áp dụng — draft gốc gọi là FB-INV-4, Williams chưa xác nhận áp cho MỌI Dialog hay chỉ recipe đã catalogue]"

# =============================================================================
# _pending_confirmation — CHƯA CHỐT
# =============================================================================
_pending_confirmation:
  - item: "Node-id thật của 'Dialog / Dialog oragism' trong Figma — chỉ có componentKey, chưa đọc được cấu trúc bên trong"
    why: "Cần link Figma trực tiếp từ Williams (get_metadata/search không tự tìm ra node-id từ componentKey)"
  - item: "OVL-INV-01 (dismiss bắt buộc) áp dụng cho MỌI Dialog hay chỉ 2 recipe đã catalogue (confirmation, form)?"
    origin: "Draft Williams 08/09 gọi là FB-INV-4"
  - item: "Xác nhận recipe 'form' bằng 1 node Figma thật, hoặc bỏ khỏi known_recipes nếu chưa có màn nào dùng"
  - item: "ĐÃ ĐÓNG (1 phần) — 'AlertDialog' là gì"
    resolved: >
      [XÁC NHẬN — Williams 12/09] AlertDialog định nghĩa theo NGHIỆP VỤ: modal
      chặn nền cho thao tác critical (không thể khôi phục HOẶC khôi phục được
      nhưng hậu quả nghiêm trọng) — xem § alert_dialog_trigger. KHÔNG còn là
      câu hỏi "có phải component Figma khác không" — Williams chủ động bỏ
      hướng phân biệt theo component/cách dùng, tập trung vào tiêu chí nghiệp
      vụ thay vì cấu trúc Figma.
    still_open: >
      CMP-DLG-01 (_composition.rules.yaml, undisableable) hiện chỉ áp cho
      intent.destructive. Case "khôi phục được nhưng hậu quả nghiêm trọng"
      (ví dụ bảng giá) KHÔNG khớp định nghĩa destructive hiện tại.
    deferred: >
      [XÁC NHẬN — Williams 12/09] "Thôi tạm thời để đơn giản hóa chưa cần thêm
      luật đâu. Nếu trong quá trình thiết kế có thêm context tao sẽ input cho
      mày thêm." → CHỦ ĐỘNG hoãn, không phải bỏ quên. KHÔNG mở rộng CMP-DLG-01,
      KHÔNG thêm rule composition mới, cho tới khi có 1 màn hình thật cần dùng
      criterion (b) của alert_dialog_trigger. Cho tới lúc đó, alert_dialog_trigger
      trong file này vẫn ghi nhận tiêu chí (b) như 1 khái niệm nghiệp vụ đã xác
      nhận — chỉ là CHƯA gắn thành 1 rule composition kiểm được.
