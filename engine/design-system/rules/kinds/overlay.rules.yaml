      artifact "EXCLAMATION" đúng là icon vỡ VÀ đúng là có pattern cảnh báo
      lỗi input thật, nhưng validation nằm ở STATE riêng của Input
      (Destructive=on → Helper message/icon), không phải rule riêng của
