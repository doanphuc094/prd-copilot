# -----------------------------------------------------------------------------
# figma_properties — tên property thật trên atom "Left menu items (Base)"
# -----------------------------------------------------------------------------
figma_properties:
  type: "Type"                          # variant — [main menu, sub menu, collapse, expand]
  state: "State"                        # variant — [Default, Active] (chỉ áp cho main menu/sub menu)
  active: "Active#4109:93"              # boolean — [XÁC NHẬN 13/09-O] defaultValue THẬT là true trên component gốc — xem § quirks.active_default_true
  right_icon: "Right icon#4109:96"      # boolean — có/không có chevron bên phải (item có sub-menu hay không)
  number_badge: "numberBadge#1128:50"   # boolean — [cần verify] ý nghĩa nghiệp vụ chưa hỏi, tạm để false
  menu_name: "Menu name#1128:62"        # boolean — [cần verify] ý nghĩa nghiệp vụ chưa hỏi
  source: "[FIGMA] componentPropertyDefinitions, đọc 13/09-J + xác nhận lại 13/09-O"

# -----------------------------------------------------------------------------
# QUIRKS — hành vi component gốc KHÔNG khớp trực giác, phải xử lý ở renderer
# -----------------------------------------------------------------------------
quirks:
  active_default_true:
    status: "[ĐÃ ĐÓNG — Williams 13/09-O]"
    finding: >
      `componentPropertyDefinitions["Active#4109:93"].defaultValue === true`
      trên chính component gốc — nghĩa là bất kỳ instance mới nào (dù chọn
      variant State=Default) đều tự động BẬT thanh accent cam bên phải trừ
      khi renderer set tường minh `Active#4109:93 = false`.
      Lần build thử đầu tiên (13/09-O) đã dính đúng quirk này: MỌI dòng đều
      hiện thanh cam, kể cả dòng không active.
    resolution: "[XÁC NHẬN — Williams] \"Thanh cam chỉ hiện khi ở trạng thái active không active mặc định ẩn đi\" — renderer PHẢI set `Active#4109:93=false` cho MỌI item không phải là item đang active, KHÔNG được dựa vào default của component."
  item_default_padding_wrong:
    status: "[PHÁT HIỆN 13/09-P, ĐÃ CÓ SỐ ĐÚNG]"
    finding: >
      Khi tạo instance MỚI từ chính component gốc (không đọc từ 1 instance
      thật đã đặt sẵn trong file Freight), padding mặc định ra
      {left:0, right:16, top:12, bottom:12} — LỆCH so với padding thật dùng
      trong sidebar Freight production ({12,12,12,12}, xem
      layout_override.item_internal_padding). Phát hiện khi build test
      13/09-P: instance tạo mới không tự khớp layout thật, phải set tường
      minh.
    resolution: "Renderer/pipeline PHẢI set tường minh padding {12,12,12,12} cho mọi item khi build — KHÔNG dựa vào padding mặc định của component gốc (giống quirk active_default_true bên dưới — đây là quirk THỨ 3 dạng 'default sai' gặp phải khi build Sidebar)."
  chevron_direction_must_be_real:
    status: "[ĐÃ ĐÓNG — Williams 13/09-N]"
    finding: >
      Sidebar Freight thật (file B2B Portal) quan sát thấy MỌI item có
      sub-menu đều hiện `chevron-down`, kể cả khi sub-menu đang mở — trông
      giống 1 quirk mặc định sai của component (giống các quirk default-sai
      từng gặp ở Dialog/BottomSheet).
    resolution: "[XÁC NHẬN — Williams] \"Okay là do tao làm ẩu không bấm active mà đổi màu đè lên component nên nó mất đi bản chất của component gốc\" (áp dụng chung cho cả quirk Active lẫn quirk chevron) — component gốc hành xử ĐÚNG (chevron đổi hướng thật theo đóng/mở), sai lệch quan sát được là do Williams tự chỉnh sửa thủ công trên file Freight, KHÔNG PHẢI lỗi hệ thống. Renderer dùng đúng rule NAV-B-03, không cần né tránh gì thêm."

# -----------------------------------------------------------------------------
# LAYOUT OVERRIDE — GHN Freight KHÔNG dùng nguyên default của component "Left
# Menu" thư viện gốc (padding 16/48/24px) — Williams: "Do atom của design
# system không có padding" → "Thôi không theo atom của design system nữa
# theo component này luôn ghi đè". Số liệu dưới đây đo THẬT từ file B2B
# Portal (Freight production, fileKey s2NE6ikwLnsZSUp97RBfof, node
# 22894:77036) — đây là NGUỒN CHUẨN cho Sidebar của Freight, không phải bản
# demo generic của thư viện GHN DS.
# -----------------------------------------------------------------------------
layout_override:
  status: "[XÁC NHẬN — Williams 13/09-O]"
  total_width:
    value: 300
    unit: px
    fixed: true
    source: "[FIGMA — ĐO THẬT] node 22894:77036 'Left Menu Freight', width=300 cố định — khớp đúng với chính component gốc (component gốc cũng width=300 khi Type=Web), Williams xác nhận lại: 'sidebar max width chỉ là 300px'."
  outer_padding:
    value: 0
    note: >
      KHÔNG dùng padding 16/48/24px như mặc định của component 'Left Menu'
      gốc — sidebar Freight thật không có outer padding, nội dung (logo,
      danh sách module) chiếm gần trọn 300px, chỉ có inset nhỏ ở cấp
      container (xem module_list_inset bên dưới).
  logo:
    left_inset_px: 18
    left_inset_px_as_seen_in_current_file: 16
    height_px: 36
    status: "[SỬA 13/09-Q — Williams]"
    note: >
      Williams: "Khoảng cách padding từ logo tới background ngoài là 18 tuy
      nhiên tao thay bằng 16px" — nghĩa là SỐ CHUẨN đúng phải là 18px, còn
      16px chỉ là số Williams TỰ THAY THẾ tạm trong file Figma hiện tại
      (không phải số chuẩn). Renderer/pipeline dùng 18px khi dựng mới,
      KHÔNG copy nguyên 16px đang thấy trong file B2B Portal.
  logo_to_module_list_gap_px: 24
  module_group_to_logout_gap_px:
    value: 24
    source: "[FIGMA — ĐO THẬT 13/09-Q] node 22894:77037/76886 — Container (module list) kết thúc ở y=496 (60+436), item 'Đăng xuất' bắt đầu ở y=520 → gap=24px. Xác nhận khớp đúng lời Williams: 'Khoảng cách từ group module đến module đăng xuất cách nhau 24px'. Đây là khoảng cách RIÊNG, khác với logo_to_module_list_gap_px (dù trùng số 24) — 'Đăng xuất' nằm NGOÀI Container, như 1 item cố định cuối sidebar."
    build_fix_13_09_S: >
      [SỬA 13/09-S] Bản build test trước đó (13/09-O..R) đặt SAI: item
      "Đăng xuất" nằm làm item CUỐI CÙNG bên TRONG Container (9/9 item),
      không tách riêng — không khớp giá trị đã ghi ở field này. Đã sửa lại
      trên canvas test: gỡ "Đăng xuất" ra khỏi Container (còn lại 8 module
      item), đặt vào 1 frame riêng "Logout wrap" (padding trái/phải 2px
      giống Container) làm con thứ 3 của SidebarMenu — tự động nhận đúng
      khoảng cách 24px nhờ itemSpacing của SidebarMenu. Đo lại xác nhận
      đúng: Container kết thúc y=444 (60+384), "Logout wrap" bắt đầu y=468
      → gap=24px khớp chính xác giá trị đã ghi.
  total_height:
    status: "[XÁC NHẬN — Williams 13/09-Q] KHÔNG cố định 1 số duy nhất."
    default_px: 1080
    default_note: "Mặc định = chiều cao 1 viewport (1080px)."
    grows_with_content: true
    grows_with_content_note: >
      Nếu nội dung trang chính dài hơn 1 viewport, sidebar PHẢI kéo dài theo
      cho khớp hết chiều cao trang — xác nhận thật qua node 22688:89818 (file
      B2B Portal): trang có nội dung cao 1800px → sidebar "Left Menu Freight"
      đo được cũng cao đúng 1800px, không dừng ở 1080px. Xem
      rules/kinds/navigation.rules.yaml § NAV-B-05.
  module_list_inset:
    left_px: 2
    right_px: 2
    item_spacing_px: 0
    status: "[SỬA 13/09-P] Đây là inset TỪ MODULE RA NGOÀI BACKGROUND (mép container) — Williams làm rõ để không nhầm với padding BÊN TRONG module (xem item_internal_padding ngay dưới). Số 2px này KHÔNG đổi, vẫn đúng."
    note: >
      Mỗi module thật rộng 296px (300 - 2 - 2), các dòng nằm SÁT NHAU (không
      có gap giữa các dòng — khoảng cách 48px/dòng đã bao gồm padding trong
      của chính item, không phải gap của container).
  item_internal_padding:
    status: "[SỬA 13/09-P — Williams: 'mày check lại đi sai rồi'] Bản trước KHÔNG ghi padding ngang bên trong item (ghi nhầm là 0). Đo lại THẬT trên đúng node Williams chỉ (22894:77044, get_variable_defs/layout properties qua use_figma)."
    padding_px: { left: 12, right: 12, top: 12, bottom: 12 }
    icon_label_gap_px:
      leading_icon_to_label: 10
      label_group_to_trailing_icon: 12
      note: >
        Williams nói cả 2 khoảng cách (icon trái↔text, text↔icon phải) đều
        là 12px — đo thật qua use_figma thì khoảng CÁCH icon trái↔label bên
        trong nhóm nội dung là 10px (itemSpacing của "Frame 7547"), còn
        khoảng cách giữa nhóm nội dung↔icon phải (chevron) là 12px (itemSpacing
        của chính item). Ghi đúng cả 2 số đo được — không tự sửa lời Williams
        thành 12/12, cũng không tự cho số đo là đúng hơn lời Williams — để
        nguyên chênh lệch nhỏ này, có thể do làm tròn khi Williams tự đo bằng
        mắt/ruler.
    source: "[FIGMA — ĐO THẬT 13/09-P] use_figma đọc trực tiếp paddingLeft/Right/Top/Bottom + itemSpacing của node 22894:77044 (Williams chỉ đích danh) — item tự nó (component gốc) đã có sẵn padding này, KHÔNG phải override riêng của Freight (khác với layout_override ở cấp container/outer)."
  item_height_px:
    default: 48
    variant_seen: 56
    status: "[cần verify] Có vài item quan sát được cao 56px thay vì 48px trong sidebar Freight thật — chưa rõ nguyên nhân (numberBadge? nội dung dài hơn?), chưa hỏi Williams."
  social_footer:
    present_in_generic_demo: true
    present_in_freight_real: false
    decision: "[XÁC NHẬN — build test 13/09-O] Sidebar Freight KHÔNG dùng phần 'Connect with us' + social icons có sẵn trong demo generic của component gốc — đã bỏ hẳn khi build test, không đăng ký phần này."

# -----------------------------------------------------------------------------
# LOGO — chưa có asset thật — [BLOCKING, Williams nhắc lại 13/09-Q] "logo
# Giaohangnhanh phải thay bằng logo GiaoHangNang" — bản build test ĐANG SAI
# (vẫn dùng logo mặc định GHN DS), CHƯA sửa được vì lý do kỹ thuật dưới đây.
# -----------------------------------------------------------------------------
logo:
  status: "[SỬA 13/09-T] Asset thật ĐÃ có trong repo (xem asset_in_repo) — CHƯA gắn được vào chính file Figma (vẫn bị chặn mạng trong phiên này, xem blocking_reason)."
  asset_in_repo:
    status: "[MỚI 13/09-T — Williams đưa file]"
    path: "profile.ghn/ds/assets/logo/Logo_Nang.svg"
    format: "SVG, viewBox 160×36 — khớp CHÍNH XÁC kích thước slot logo đã định (layout_override.logo.height_px=36, width slot=160)."
    source: >
      Williams: "Trong thư mục download của máy này có logo svg với tên là
      Logo_Nặng nhờ mày đẩy lên git" — file gốc
      `C:\Users\admin\Downloads\Logo_Nặng.svg` (33033 bytes), đã copy nguyên
      vẹn vào repo tại đường dẫn trên qua device bridge (không qua bước tải
      xuống bị chặn — file này nằm sẵn trên máy Williams, không phải tải từ
      figma.com).
    how_to_call_from_figma: >
      [TRẢ LỜI câu hỏi Williams "khi cần gọi qua figma thì sao"] Việc đẩy
      file này lên git CHỈ giải quyết việc có 1 nguồn asset chuẩn, được
      version-control, dùng chung cho toàn bộ pipeline — nó KHÔNG tự động
      gắn được vào file Figma trong phiên này, vì việc gắn ảnh vào Figma vẫn
      đi qua đúng con đường bị chặn mạng (mcp.figma.com, xem
      blocking_reason). 2 cách dùng thật:
      (1) Williams tự kéo/dán trực tiếp file SVG này vào Figma (Williams
      không bị chặn mạng) — nhanh nhất cho việc sửa ngay file test/production
      hiện tại;
      (2) Khi pipeline render Figma chạy ở 1 môi trường KHÔNG bị chặn
      egress figma.com (vd máy Williams, hoặc 1 phiên cloud có quyền mạng
      khác), renderer đọc file SVG này thẳng từ repo (đường dẫn cố định ở
      trên) và gọi `upload_assets`/tương đương để nhúng — đây là lý do asset
      phải nằm trong git thay vì chỉ gửi qua chat, để MỌI lần render sau này
      đều dùng đúng 1 nguồn, không phải xin lại Williams mỗi lần.
  current_placeholder: >
    [CẬP NHẬT 13/09-R] Logo mặc định GHN DS ('GiaoHangNhanh') đã được GỠ
    khỏi bản build test (không còn hiện logo sai nữa). Thay vào đó là 1
    khung placeholder có viền nét đứt + label "LOGO Giao Hàng Nặng (chưa
    gắn được ảnh — upload bị chặn)", đặt trong khung auto-layout
    paddingLeft=18px đúng theo layout_override.logo.left_inset_px. Williams
    đã upload ảnh logo thật (PNG 320×72, 2x kích thước slot 160×36) trực
    tiếp vào chat — vẫn CHƯA gắn được vào file Figma, xem blocking_reason.
  real_asset_reference: "node 22894:77039 ('Logo'), file B2B Portal (s2NE6ikwLnsZSUp97RBfof) — logo 'GHN' + wordmark 'GiaoHang NẶNG' + tagline 'Hàng Nặng Ký, Giá Nhẹ Vi'. Không tải được về do egress policy chặn figma.com trong phiên này — xem sidebar-research-notes.md § 6."
  blocking_reason: >
    Mạng ra ngoài của môi trường cloud hiện tại (phiên này) chặn domain
    figma.com theo chính sách tổ chức — không bypass được.
    [MỞ RỘNG 13/09-R] Đã thử CHIỀU NGƯỢC LẠI (upload thay vì download):
    dùng tool `mcp__Figma__upload_assets` lấy được `submitUrl` dạng
    `https://mcp.figma.com/mcp/upload/.../submit`, rồi `curl -X POST
    multipart/form-data` tới URL đó — THẤT BẠI với đúng lỗi dạng
    `curl: (56) CONNECT tunnel failed, response 403` /
    `mcp.figma.com:443 — connect_rejected (organization policy)`, giống hệt
    lỗi khi tải xuống `www.figma.com`. Kết luận: domain `mcp.figma.com`
    CŨNG bị chặn, không chỉ `www.figma.com` — cả 2 CHIỀU (tải xuống asset
    VÀ tải lên asset) đều bị chặn bởi cùng 1 chính sách egress của tổ
    chức. Không thử bypass thêm. Cần 1 trong 2: (a) thử lại ở phiên có
    quyền mạng khác, hoặc (b) Williams tự dán ảnh logo vào file Figma thật
    bằng tay (Williams có quyền truy cập bình thường, không bị chặn).

# -----------------------------------------------------------------------------
# ICON — dùng đúng cơ chế FA6 ligature như Input/Button (xem
# _shared.binding.yaml § icon mechanism chung, form_input.rules.yaml)
# -----------------------------------------------------------------------------
icon:
  glyph_mechanism: >
    Icon glyph set bằng cách ghi TÊN ligature FA6 vào `characters` của TEXT
    con lồng trong instance "font awesome / Base" (icon trái) hoặc
    "font awesome / base" (chevron phải) — giống Input/Button, không phải 1
    property biến thể riêng.
  confirmed_icons_used_in_freight_real:
    status: "[FIGMA — ĐỌC THẬT từ sidebar Freight thật 13/09-J, CHƯA qua bước xác nhận FA6 Pro đầy đủ]"
    list: [user, boxes-stacked, house-night, map-location-dot, truck-field,
           file-lines, file-invoice-dollar, clipboard-list-check,
           square-fragile, arrow-right-from-bracket, chevron-down, chevron-up]
    note: >
      Chưa chạy quy trình xác nhận 2 bước đầy đủ (offline FA6 Free catalog +
