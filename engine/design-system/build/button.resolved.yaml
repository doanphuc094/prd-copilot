      guardrail: manifest.yaml § guardrails.component_file_stays_small (> 5 rule → cảnh báo)
      what_it_means: >
        File này phình lên KHÔNG có nghĩa Button phức tạp hơn dự kiến. Nó có nghĩa một `kind` đang
        thiếu hoặc sai. Cách sửa là bốc luật lên đúng kind (hoặc tạo kind mới nếu đủ >= 3 thành viên
        thật), KHÔNG phải nuôi file này.
