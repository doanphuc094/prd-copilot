# =============================================================================
# feedback_transient.rules.yaml — LOẠI: PHẢN HỒI KHÔNG CHIẾM QUYỀN TƯƠNG TÁC
#
# Thành viên:
#   đang dùng:  Toast, Alert (đăng ký 12/09 — xem rules/components/toast.rules.yaml,
#               rules/components/alert.rules.yaml, và profile.ghn/ds/{toast,alert}.binding.yaml)
#   dự kiến:    (không còn — cả 2 thành viên dự kiến ban đầu đã active)
#
# Trục bắt buộc: status
#
# ⚠️ TÊN + MÔ TẢ KIND NÀY TRONG manifest.yaml CÓ THỂ CẦN SỬA (đề xuất, xem
# _pending_confirmation cuối file):
#   manifest.yaml hiện mô tả: "Xuất hiện rồi tự biến mất"
#   → điều này CHỈ đúng cho Toast pattern `status` (tự biến mất theo thời gian,
#     KHÔNG có nút đóng thủ công — xác nhận Williams 12/09).
#   → Alert là banner TĨNH, nằm nguyên trong layout, KHÔNG tự biến mất
#     [XÁC NHẬN — Williams 12/09, ảnh "Có 2 điểm giao không thể xếp tuyến"].
#   → Cái THẬT SỰ chung giữa Toast và Alert không phải "tự biến mất", mà là:
#     không có backdrop, không chặn thao tác phía sau, không ép người dùng xử
#     lý trước khi làm việc khác — khác hẳn overlay (Dialog), nơi luôn chiếm
#     focus/chặn nền [xem rules/kinds/overlay.rules.yaml].
#   Đề xuất sửa component_kinds.feedback_transient.about trong manifest.yaml
#   theo định nghĩa hành vi này — CHƯA sửa, chờ Williams xác nhận.
#
# Đọc _core.rules.yaml trước — kiểu trục, kỷ luật, ngưỡng cảm ứng ở đó.
# version: 2.0-draft
# =============================================================================

meta:
  kind: feedback_transient
  layer: kind
  portable: true
  version: 2.0-draft
  requires: [_core.rules.yaml]
  requires_axes: [status]
  status: "[ĐỀ XUẤT — nhiều mục đã Williams xác nhận qua chat 12/09, một số mục còn mở — xem _pending_confirmation]"

undisableable: []

# =============================================================================
# STATUS — trục ngữ nghĩa trạng thái hệ thống
#
# KHÁC với action_trigger.intent: intent nói "vai của hành động trong việc
# hoàn thành mục đích màn hình" (primary/alternate/destructive/no_path).
# status nói "hệ thống vừa báo cái gì" (thành công/lỗi/...). Hai trục độc lập,
# không dùng lẫn tên hay logic của nhau.
# =============================================================================
status:
  decides: status
  axis_kind: closed_role_set
  ask: "Phản hồi này báo về trạng thái hệ thống nào vừa xảy ra hoặc đang tồn tại?"

  roles_confirmed:
    - role: success
      meaning: "Một hành động người dùng vừa hoàn thành đúng như mong đợi"
      icon_meaning: "dấu tích trong vòng tròn (check-circle)"
      source: "[XÁC NHẬN — Williams 12/09] ảnh Toast 'Cập nhật thông tin thành công'"
    - role: error
      meaning: "Một hành động thất bại, hoặc có điều kiện lỗi cần chú ý"
      icon_meaning: "dấu X trong vòng tròn (x-circle)"
      source: "[XÁC NHẬN — Williams 12/09] ảnh Toast 'Đã huỷ tải về' + ảnh Alert 'Có 2 điểm giao không thể xếp tuyến'"

  roles_open:
    note: >
      Toast BẢN DESKTOP trong Figma có 9 giá trị Type: White, Primary, Success,
      Secondary, Error, Grey, Disable, Warning, Info — chỉ 2 giá trị (Success,
      Error) đã có ảnh thật xác nhận ý nghĩa.
    values_backlogged:
      list: [Warning, Info, Primary, Secondary, Grey, White, Disable]
      status: "[XÁC NHẬN — Williams 12/09] Chưa có giá trị thực — đưa vào backlog, KHÔNG đưa vào status.roles_confirmed"
      quote: "Hiện tại chưa có giá trị thực cho 7 giá trị đó của toast, đưa vào backlog giống button"
      precedent: >
        Cùng kiểu xử lý với button.binding.yaml § quirks.status_color_types
        (Info/Success/Warning bị profile.policy.excluded khỏi Button) — trục
        Type/Style của component này có nhiều giá trị hơn số giá trị thật sự
        có ý nghĩa nghiệp vụ đã xác nhận, và đó là chuyện bình thường, không
        phải lỗi.
      growth: >
        Khi 1 trong 7 giá trị này có màn hình thật cần dùng, chuyển từ
        values_backlogged sang status.roles_confirmed kèm nguồn — không suy
        đoán trước.
    cross_reference: >
      button.binding.yaml § quirks.status_color_types đã ghi chú trước:
      "Bộ giá trị Info/Success/Warning CHÍNH LÀ trục status mà Toast BẮT BUỘC
      phải có — cùng bộ từ, Button cấm dùng, Toast bắt buộc dùng." Điều này gợi
      ý chỉ nhóm mang nghĩa trạng thái (Success/Error/Warning/Info) thuộc trục
      `status` thật sự; Primary/Secondary/Grey/White/Disable có thể KHÔNG phải
      status (có thể là giá trị style/kiểu hiển thị khác, hoặc trạng thái
      neutral/hệ thống chưa được đặt tên) — cần Williams xác nhận, không suy
      đoán tiếp ở lớp kind.
    mobile_evidence: >
      [FIGMA — node 3569:33454 "Toast Message (Mobile App)", đọc 12/09] Toast
      bản MOBILE (app tài xế) dùng trục "Status" riêng, CHỈ 4 giá trị: Success,
      Failed, Info, Warning — sạch hơn hẳn bản desktop, không lẫn giá trị màu
      kiểu Button (Primary/Secondary/Grey/White/Disable). Đây là bằng chứng
      MẠNH ủng hộ giả thuyết: 4 giá trị này (đổi tên Error→Failed) mới là
      `status` thật; phần còn lại của Type bên desktop nhiều khả năng là kế
      thừa property dùng chung với Button, không có ý nghĩa status riêng.
      Toast desktop và Toast mobile có thể là 2 BINDING khác nhau của cùng 1
      khái niệm `status` — cần Williams xác nhận trước khi viết binding.

  icon_meaning_vocabulary:
    growth: >
      Mỗi khi 1 status role mới được xác nhận, thêm 1 dòng vào roles_confirmed
      (ý nghĩa) và binding thật vào profile.binding.icon_names — không tự thêm
      icon cho status chưa xác nhận.

  fallback:
    action: escalate
    message: "Không xác định được trạng thái hệ thống từ tài liệu nghiệp vụ. Cần designer chỉ định."

# =============================================================================
# ĐÃ DỜI sang component — Toast giờ đã đăng ký trong manifest.yaml § components
#
# Định nghĩa chính thức Toast (docs Figma), content_pattern (status/action),
# invariant dismiss-theo-action, và writing guideline — tất cả đã chuyển sang
# rules/components/toast.rules.yaml (đúng nguyên tắc kind/component: cái gì
# CHỈ riêng Toast thì không ở lại đây, vì Alert có content_pattern khác hẳn).
# Tương tự, content_pattern của Alert (inline_link) nằm ở
# rules/components/alert.rules.yaml.
# =============================================================================

# =============================================================================
# GIỚI HẠN HÀNH VI CỦA LOẠI
# =============================================================================
behavioural_limits:
  - id: FBTR-B-01
    rule: >
      feedback_transient KHÔNG được dùng để bắt buộc người dùng xác nhận một
      hành động phá huỷ. Việc đó thuộc overlay (Dialog) — xem CMP-DLG-01.
    why: >
      Toast/Alert không chặn thao tác nền và có thể bị bỏ lỡ (Toast tự biến
      mất theo thời gian, Alert có thể nằm ngoài vùng nhìn thấy khi cuộn) —
      không đủ đảm bảo người dùng đã đọc trước khi hệ thống cho phép hành động
      tiếp theo xảy ra.
    relation_to_composition_rule: "Hệ quả trực tiếp của CMP-DLG-01 — không lặp logic ở đây, chỉ tham chiếu."

  - id: FBTR-B-02
    rule: "Thành viên của kind này không được có backdrop, không bẫy focus (focus trap)."
    why: "Đây chính là ranh giới hành vi phân biệt feedback_transient với overlay — xem block đầu file."

# =============================================================================
# _pending_confirmation — CHƯA CHỐT, không đưa vào build tới khi Williams xác nhận
# =============================================================================
_pending_confirmation:
  - item: "Đổi component_kinds.feedback_transient.about trong manifest.yaml"
    from: "Xuất hiện rồi tự biến mất"
    to: "Phản hồi không chiếm quyền tương tác — không backdrop, không chặn nền, không bẫy focus"
    why: "Xem block đầu file — 'tự biến mất' không đúng với Alert (banner tĩnh). Cần xác nhận thêm sau câu trả lời của Williams về 'Alert Dialog' — xem mục cuối."
  - item: "ĐÃ ĐÓNG — 7 giá trị Type còn lại của Toast desktop (Warning, Info, Primary, Secondary, Grey, White, Disable)"
    resolved: "[XÁC NHẬN — Williams 12/09] Backlog, chưa có giá trị thực — xem status.roles_open.values_backlogged"
  - item: "ĐÃ ĐÓNG — kitchen sink Type=Primary (2 button)"
    resolved: "[XÁC NHẬN — Williams 12/09] Đúng là demo, chưa có context thực nào. Pattern action thật (1 nút, xem toast_content_pattern_draft.patterns.action) có bằng chứng độc lập từ hướng dẫn UX writing mobile."
  - item: "Alert có nút đóng thủ công (dismiss) không, hay chỉ biến mất khi điều kiện lỗi được giải quyết?"
    why: "Chưa có bằng chứng — chỉ mới xác nhận Alert KHÔNG tự biến mất theo thời gian như Toast"
  - item: "ĐÃ ĐÓNG — 'Alert Dialog' có chặn nền hay không, và Alert có thuộc cả 2 kind không"
    resolved: >
      [XÁC NHẬN — Williams 12/09] Williams chủ động BỎ hướng "Alert thuộc cả 2
      kind tuỳ cách dùng" — vì use case Alert-không-chặn-nền "rất ít". AlertDialog
      được định nghĩa lại theo tiêu chí NGHIỆP VỤ (không phải theo Figma
      component): modal cảnh báo cho thao tác CRITICAL — có thể HOẶC không thể
      khôi phục; NẾU khôi phục được thì hậu quả vẫn phải rất nghiêm trọng (ví dụ
      thật: kích hoạt bảng giá — nếu bảng giá mới sai, đơn hàng đã lên theo giá
      sai, ảnh hưởng tính doanh thu toàn hệ thống — dù về mặt kỹ thuật có thể
      sửa lại được). Xem rules/kinds/overlay.rules.yaml § AlertDialog và
      _pending_confirmation ở đó về việc mở rộng CMP-DLG-01.
