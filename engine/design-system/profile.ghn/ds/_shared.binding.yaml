# =============================================================================
# _shared.binding.yaml — GIÁ TRỊ DS DÙNG CHUNG MỌI COMPONENT (lớp C)
#
# Mọi component đều nạp file này. Thứ gì Toast/Dialog/Input cũng dùng lại y
# nguyên thì nằm ở đây; thứ riêng của một component nằm ở <component>.binding.yaml
#
# Bằng chứng cần file này: bản v1 nhét breakpoints + icon_names + bẫy của Badge
# vào ds-binding của Button, tức là Toast sẽ phải đọc binding của Button để lấy
# tên icon. Đo được: 43% nội dung ds-binding v1 thuộc loại dùng chung.
#
# design_system: GHN DS
# version: 2.0-draft
# =============================================================================

meta:
  design_system: GHN DS
  ds_file_key: zECOR8UK45lmZcpMG9aOR7
  layer: ds-binding-shared
  version: 2.0-draft
  created: "2026-09-08"
  library_filter_warning: >
    Mọi tra cứu sống qua công cụ DS PHẢI lọc libraryName === "GHN DS". File
    keymap có nhiều library trùng tên component (bản test, Freight, QLNS/QLNL)
    — tra sai library sẽ ra component ảo.

# -----------------------------------------------------------------------------
# BREAKPOINTS — cấp file, không thuộc component nào
# -----------------------------------------------------------------------------
breakpoints:
  values:
    sm:  640
    md:  768
    lg:  1024
    xl:  1280
    2xl: 1536
  unit: px
  source: "[FIGMA] collection 'Breakpoints', 5 biến, đọc 08/09"
  scale_note: "Trùng đúng scale mặc định của Tailwind CSS."
  name_collision_warning:
    severity: cao
    problem: >
      Nhiều component có thang size cũng dùng tên sm/md/lg/xl. Nên "md" có thể
      là bước size HOẶC breakpoint tuỳ ngữ cảnh.
    mitigation: >
      Luôn viết đủ tiền tố khi trích: `binding.size.md` và
      `binding.breakpoints.md`. KHÔNG bao giờ viết "md" trơ trong file rule.

# -----------------------------------------------------------------------------
# BỘ ICON — cấp file
# -----------------------------------------------------------------------------
icon_set:
  name: "Font Awesome 6 Pro"
  full_catalog_size: "~3000+ icon (bộ Pro đầy đủ)"
  confirmed_page: "Icons (Use fontawesome 6 Pro) — nodeId 12:2"
  confirmed_page_note: >
    Trang này là icon ĐÃ dùng trong sản phẩm (~36 icon, mỗi cái có bản regular
    + solid), KHÔNG phải toàn bộ kho. Icon ngoài danh sách vẫn dùng được nhưng
    CHƯA xác nhận đã import.
  confirmed_icons:
    [eye, eye-slash, home, bell, user-hair, lock, medal, gear, camera,
     arrow-left-long, arrow-right-long, arrow-up-long, arrow-down-long,
     chevron-left, chevron-right, chevron-up, chevron-down,
     arrow-right-from-bracket, arrow-progress, arrows-rotate, arrow-up-arrow-down,
     clock, clock-rotate-left, filter-list, trash, pen, route, truck-fast,
     bullhorn, circle-info, grip-dots, grip-dots-vertical, file-arrow-up,
     money-check-dollar, magnifying-glass-dollar, hexagon-exclamation,
     screwdriver-wrench]
  source: "[FIGMA] đọc metadata trang 12:2 ngày 07/09"

