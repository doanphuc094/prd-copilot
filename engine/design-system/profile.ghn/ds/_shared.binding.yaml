new_icon_process:
  marker: "[GIỚI HẠN THẬT]"
  rule: >
    Hành động chưa có trong icon_names → chạy ĐỦ 2 bước theo thứ tự bên dưới.
    KHÔNG được bỏ qua bước 1 rồi tự tin dùng luôn tên đề xuất — bước 1 chỉ lọc
    được "tên bịa/sai chính tả", KHÔNG thay thế bước 2 (bước 2 vẫn bắt buộc).

  step_1_offline_name_check:
    what: >
      Trước khi đưa tên icon đề xuất cho người xác nhận, agent tự kiểm tra tên
      đó có THẬT SỰ tồn tại trong catalog Font Awesome 6 hay không, bằng dữ
      liệu chính thức — KHÔNG đoán theo trí nhớ, KHÔNG scrape website JS
      (fontawesome.com/search — đã thử, thất bại, xem why_step_1_exists).
    how: >
      Cài gói npm chính thức của Font Awesome vào workspace của AGENT (không
      phải vào repo dự án — đây là công cụ tra cứu tạm thời, không phải
      dependency của PRD Copilot):
        npm install @fortawesome/fontawesome-free@6.7.2
      Đọc file đi kèm: node_modules/@fortawesome/fontawesome-free/metadata/icon-families.json
      — file JSON này là danh sách tên/alias/search-term CHÍNH THỨC của Font
      Awesome, khoá theo đúng tên icon (vd "trash", "pen", "filter"). Tra tên
      đề xuất có phải 1 khoá trong file này không.
    coverage_limit: >
      File này CHỈ phủ tầng Free (~1895 icon), KHÔNG có icon riêng của Pro
      (GHN dùng FA6 Pro, `icon_set.full_catalog_size` ~3000+ icon). Tên KHÔNG
      có trong file này KHÔNG TỰ ĐỘNG SAI — có thể là icon Pro thật. Ngược
      lại: tên CÓ trong file này thì chắc chắn ĐÚNG (đây là dữ liệu chính
      thức, không phải suy đoán) — dùng để LOẠI tên bịa/sai chính tả, không
      dùng để KHẲNG ĐỊNH một tên là sai.
    if_found: "Đánh dấu tên đề xuất là đã xác nhận CÚ PHÁP đúng thật (không phải bịa) — vẫn phải qua step_2 mới được dùng thật."
    if_not_found: "Không loại bỏ ngay — có thể là icon Pro. Ghi rõ 'chưa xác nhận qua dữ liệu Free' khi đưa cho step_2, để người xác nhận biết cần tự kiểm tra kỹ hơn."
    precedent: >
      Ngày 12/09: dùng đúng quy trình này phát hiện "filter-list" (ghi từ
      trang Icons 12:2 ngày 07/09) không tồn tại trong catalog FA6 — chỉ có
      "filter"/"filter-circle-dollar"/"filter-circle-xmark". Williams xác
      nhận đổi sang "filter" — xem decisions.md 12/09-A và
      icon_set.correction_2026-09-12.

  step_2_human_confirm:
    what: >
      DÙ step_1 đã xác nhận cú pháp đúng, vẫn PHẢI có người mở plugin bộ icon
      trong công cụ thiết kế (hoặc tự tra trực tiếp trên fontawesome.com bằng
      mắt) xác nhận icon đó ĐÃ ĐƯỢC IMPORT vào file DS thật và ĐÚNG NGỮ CẢNH
      sử dụng — trước khi renderer dùng thật.
    why: >
      step_1 chỉ trả lời "tên này có tồn tại trong catalog Font Awesome
      không", KHÔNG trả lời "icon này đã có sẵn trong file Figma của GHN
      chưa" và KHÔNG trả lời "icon này có đúng ý nghĩa nghiệp vụ mà designer
      muốn không" — hai câu đó chỉ người mới trả lời được.

  why_step_1_exists: >
    Trước 12/09, quy trình chỉ có step_2 (bước người) — nghĩa là MỌI tên đề
    xuất, kể cả tên bịa hoàn toàn, đều phải chờ người kiểm hết, không có lớp
    lọc rẻ nào ở giữa. step_1 không thay thế step_2, chỉ giảm số lần người
    phải xử lý một tên rõ ràng sai ngay từ đầu.
  why_cannot_automate_fully: >
    Đã thử tự động hoá 100% và thất bại thật: fetch trang search của bộ icon
    không được (web app JS, không đọc được qua fetch thường); công cụ tra
    design system chỉ tìm được component/style đã publish, không tìm được
    icon instance lẻ. Gói npm ở step_1 KHÔNG giải quyết được 2 việc đó — nó
    chỉ giải quyết "tên có tồn tại trong catalog Font Awesome không", nên
    step_2 vẫn không thể bỏ.
  source: "[XÁC NHẬN — Williams 07/09 (step_2), 12/09 (step_1 bổ sung)]"

# -----------------------------------------------------------------------------
# QUIRK CẤP FILE — ảnh hưởng MỌI component
# -----------------------------------------------------------------------------
file_level_quirks:
  no_responsive_dimension_mode:
    marker: "[GIỚI HẠN THẬT]"
    finding: >
      Collection 'Dimensions' chỉ có 1 mode ("Mode 1") và KHÔNG có biến nào
      tên button/height/target/tap/touch.
    source: "[FIGMA] đọc 08/09"
    consequence: >
      DS KHÔNG có cơ chế đổi kích thước theo thiết bị qua variable mode. Mọi
      sàn/ngưỡng theo thiết bị PHẢI do compiler áp khi chọn variant — không
      đẩy xuống cho công cụ thiết kế tự giải được.
    affects_every_component_with: ordered_scale_physical
    implication_for_handoff: >
      Bản thiết kế phải có frame riêng cho breakpoint hẹp; không có cách nào
      để 1 frame tự đổi kích thước theo khung nhìn.

  color_modes_exist:
    finding: "Collection 'Color Mode' có 2 mode: Light / Dark"
    source: "[FIGMA] đọc 08/09"
    status: >
      CHƯA khảo sát ảnh hưởng tới luật. Ghi lại vì component nào bind màu sẽ
      cần biết — hiện chưa có luật nào phụ thuộc.

# -----------------------------------------------------------------------------
# BẪY LIÊN COMPONENT — đã trả giá thật, giữ để không tái phạm
# Đây là chỗ mà bản v1 phải nhét vào binding của Button vì không có nhà.
# -----------------------------------------------------------------------------
cross_component_traps:
  badge_color_alias:
    component: Badge
    trap: >
      Property 'Color' của Badge nhận Grey / Success / Error — KHÔNG có variant
      tên 'Destructive'. Dùng 'Destructive' làm setProperties() thất bại TOÀN
      BỘ (all-or-nothing), badge rơi về label mặc định.
    source: "[FIGMA] phát hiện khi render thật, xem phase1-compiler-notes.md"
    class_of_error: "Tên semantic không trùng chuỗi DS — đúng loại lỗi lớp binding tồn tại để hấp thụ"

  setproperties_is_all_or_nothing:
    trap: >
      Một property sai tên làm TOÀN BỘ lệnh setProperties thất bại, không phải
      chỉ property đó. Node rơi về giá trị mặc định của component.
    consequence: >
      Không được coi "render không báo lỗi" là bằng chứng đúng — phải đọc lại
      property THẬT sau khi render [_core.discipline.validator_is_not_proof].

# -----------------------------------------------------------------------------
# BADGE — màu + ý nghĩa
# Migrate từ claude/agentic-ds-drafts/semantic.json 09/09 — xem decisions.md 09/09-B.
# button.* của semantic.json KHÔNG migrate (đã thay bằng ds/button.binding.yaml
# + policy + rules); role name "cancel" KHÔNG migrate (bỏ theo decisions.md 08/09-B).
# -----------------------------------------------------------------------------
badge:
  note: >
    Cả 3 màu đều render dạng PILL có nền — không có màu nào là text trần.
    Property thật trên component Badge tên là 'Color'.
  colors:
    grey:
      ds_property_value: Grey
      render_style: pill_filled
      when_to_use: "Trung tính / chưa xử lý (vd 'Chờ duyệt')"
      warning: "KHÔNG render thành text thường không nền — đã từng làm sai."
    green:
      ds_property_value: Success
      render_style: pill_filled
      when_to_use: "Đã xử lý tích cực (vd 'Đã duyệt')"
    red:
      ds_property_value: Error
      render_style: pill_filled
      when_to_use: "Chỉ khi thực sự quan trọng / cần chú ý (vd 'Từ chối')"
      warning: >
        KHÔNG dùng giá trị 'Destructive' cho property Color — component Badge
        không có variant này, setProperties() sẽ thất bại toàn bộ (all-or-
        nothing) và badge rơi về label mặc định 'Label'. Alias đúng là 'Error'.
  no_color_borrowing_rule: >
    Khi 1 màn có NHIỀU badge/chip cạnh nhau nhưng khác ý nghĩa, mỗi cái lấy
    màu theo ĐÚNG ý nghĩa riêng — KHÔNG mượn màu của badge/chip khác gần đó.

# -----------------------------------------------------------------------------
# SURFACE — bề mặt/khung. Chỉ 1 mục có bằng chứng render thật, phần còn lại
# CHƯA khảo sát — không tự bịa.
# -----------------------------------------------------------------------------
surface:
  table_header:
    background: "#fafafa"
    border: "có viền dọc (stroke) phân chia cột — cả header lẫn dòng dữ liệu bên dưới"
    when_to_use: "CỐ ĐỊNH cho mọi table_card, không tuỳ biến theo màn"
    confirmed_source: "schema-v1-draft.md Mục 3a, field header_style"
  not_yet_surveyed:
    [card_background, modal_overlay_background, sidebar_background,
     "input field border/background theo state (default/focus/error/disabled)"]

# -----------------------------------------------------------------------------
# TEXT STYLE theo ngữ cảnh. Chỉ 2 mục có bằng chứng thật.
# -----------------------------------------------------------------------------
text_style:
  table_header_label:
    weight: semibold
    size: 14px
    color: text-muted
    confirmed_source: "schema-v1-draft.md Mục 3a, field header_style"
  diff_view_old_value:
    style: strikethrough
    when_to_use: "Giá trị CŨ trong modal đối chiếu — PHẢI có gạch ngang, không dùng style thường"
    confirmed_source: "schema-v1-draft.md Mục 4, field diff_view"
  diff_view_new_value:
    style: "emphasized (nổi bật, không gạch)"
    when_to_use: "Giá trị MỚI trong modal đối chiếu — đối lập trực quan với giá trị cũ"
    confirmed_source: "schema-v1-draft.md Mục 4, field diff_view"
  not_yet_surveyed:
    ["mã màu thật của 'text-muted' (hiện chỉ là tên semantic)", "heading H1/H2/H3",
     "body text mặc định", "error/helper text dưới input"]

# -----------------------------------------------------------------------------
# SPACING — chỉ density đã migrate (có value thật ở dạng enum). Base scale px
# và grid_units_per_row CHƯA migrate vì CHƯA có số thật, không phải bị bỏ sót
# — cần đọc ghn-spacing-tokens.json gốc trước.
# -----------------------------------------------------------------------------
spacing:
  density:
    enum: [compact, comfortable]
    note: >
      Chỉ là nhãn ngữ nghĩa (compact = vận hành nội bộ, nhiều dòng/màn) — CHƯA
      có mapping ra padding/row-height thật.
    confirmed_source: "schema-v1-draft.md Mục 1"
  not_yet_surveyed: >
    grid_units_per_row (khái niệm cấu trúc "N-unit/hàng", chưa rõ 1 unit = bao
    nhiêu px thật) và base spacing scale (4px/8px grid hay gì).
