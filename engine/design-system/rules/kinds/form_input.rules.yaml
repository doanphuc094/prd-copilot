      Field ở State=Default (chưa nhập gì, không phải dropdown) — icon phải
      là gì? Suy luận theo FRMIN-B-02: không khớp cả 3 case → không icon
      phải nào. CHƯA hỏi lại Williams để xác nhận tường minh, chỉ là suy
      luận hợp lý từ rule đã có.
  - item: >
      Field State=Disabled — icon phải xử lý thế nào (giữ nguyên theo state
      trước khi disable, hay luôn ẩn)? Chưa hỏi.
  - item: >
      Field vừa là dropdown vừa đang Filled (có giá trị đã chọn) — ưu tiên
      chevron hay clear? FRMIN-B-02 liệt kê 3 case như loại trừ nhau nhưng
      chưa rõ thứ tự ưu tiên khi 2 điều kiện cùng đúng lúc (dropdown + có
      giá trị). Chưa hỏi.
  - item: >
      [ĐÃ ĐÓNG — 13/09] FRMIN-B-03 đã được Williams xác nhận và áp dụng: field
      "Diễn giải" đã bỏ icon trái align-left trên render Figma. Xem
      decisions.md § 13/09-E.
