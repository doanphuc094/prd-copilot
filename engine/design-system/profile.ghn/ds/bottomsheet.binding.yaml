  source: "[FIGMA] componentPropertyDefinitions + cấu trúc con, đọc 13/09"

# -----------------------------------------------------------------------------
# QUIRK — khác biệt với Dialog, cần verify riêng
# -----------------------------------------------------------------------------
quirks:
  no_legacy_button_issue: >
    [XÁC NHẬN bằng kiểm tra thật 13/09] KHÔNG bị lỗi giống Dialog (Dialog dùng
    nhầm Button set CŨ "Stype=Round" làm mặc định). Kiểm tra trực tiếp 2 nút
    footer trong variant "w Button": cả 2 đều trỏ đúng `parentComponentSetKey`
    = `4e004e9d80a82cf3b0ec50e3b8cb9c6fb8eeb210` — CHÍNH LÀ Button organism
    THẬT đã xác nhận (không phải set cũ). BottomSheet không dính quirk này.
  footer_button_type_variance:
    status: "[XÁC NHẬN — Williams 13/09] ĐÃ SỬA, ÁP DỤNG rule chung với Dialog."
    original_finding: >
      Mặc định demo của "w Button" dùng 2 nút KHÁC Type nhau: nút trái
      Type=Secondary (Style=Fill Round), nút phải Type=Primary (Style=Fill
      Round) — KHÁC với rule OVL-B-03 đã xác nhận cho Dialog ("cả 2 nút đều
      Type=Primary, chỉ khác Style Outline/Fill").
    resolution: >
      [XÁC NHẬN — Williams 13/09] "Thay secondary button của bottom sheet
      thành primary/outline cho đồng bộ với dialog của desktop" — ĐÂY LÀ QUIRK
      cùng loại với Dialog (component gốc có 1 bản mặc định KHÔNG khớp quy
      ước thật), KHÔNG PHẢI 1 convention riêng của BottomSheet. Rule OVL-B-03
      (cả 2 nút Type=Primary, khác Style Outline/Fill) áp DÙNG CHUNG cho cả
      Dialog lẫn BottomSheet — 1 rule duy nhất ở cấp kind `overlay`, không
      tách riêng theo member. Đã sửa trực tiếp trên instance demo (`use_figma`,
      node `I69:4911;1128:71416`): Type Secondary→Primary, Style Fill
      Round→Outline Round. Đã chụp screenshot xác nhận: 2 nút cùng màu cam
      (Primary), khác Style Outline/Fill — khớp visual với Dialog.
      Xem decisions.md § 13/09-G.

