# -----------------------------------------------------------------------------
# QUIRK RIÊNG — đã trả giá thật (xem decisions.md 12/09-J/L)
# -----------------------------------------------------------------------------
quirks:
  master_default_uses_outdated_button:
    severity: cao
    finding: >
      Bản mặc định của chính component gốc (khi import, chưa override gì) có
      Footer dùng BỘ BUTTON CŨ/LEGACY (biến thể tên "Stype=Round" — property
      lỗi chính tả, khác hẳn "Style" của Button organism thật), và nút vị trí
      "Secondary CTA" mặc định là Type=Grey.
      Xác nhận lại 12/09 (re-verify qua use_figma, khớp đúng phát hiện cũ ở
      decisions.md 12/09-J): mainComponent 2 nút Footer mặc định là
      "Stype=Round, Size=sm, Type=Grey, State=Default" và "Stype=Round,
      Size=sm, Type=Primary, State=Default".
    consequence: >
      TUYỆT ĐỐI KHÔNG dùng bản mặc định của component gốc làm chuẩn tham
      chiếu cho footer — nó KHÔNG khớp quy ước đã xác nhận thật
      (`default_2_button_style` ở overlay.rules.yaml: cả 2 nút đều dùng Button
      organism THẬT — componentKey `4e004e9d80a82cf3b0ec50e3b8cb9c6fb8eeb210`
      — và đều Type=Primary, chỉ khác Style Outline/Fill). Khi dựng Dialog
      thật, PHẢI tự thay 2 instance Footer bằng Button organism đúng, KHÔNG
      giữ nguyên bản mặc định.
    source: "[FIGMA] xác nhận trực tiếp qua use_figma 12/09, khớp lại phát hiện đã ghi ở decisions.md 12/09-J/L"

  no_responsive_size_mode:
    finding: "Áp dụng file_level_quirks.no_responsive_dimension_mode (_shared.binding.yaml) — Dialog cũng không có cơ chế đổi kích thước theo breakpoint qua variable mode, compiler phải tự áp."
    consequence: >
      [XÁC NHẬN — Williams 13/09] Dialog THẬT SỰ đổi thành BottomSheet trên
      mobile (đúng lý do BottomSheet tồn tại như 1 member riêng của kind
      overlay) — TRỪ AlertDialog, luôn giữ nguyên dạng Dialog (modal giữa
      màn hình) trên MỌI kích thước, kể cả mobile. Xem rule đầy đủ ở
      `rules/kinds/overlay.rules.yaml § responsive_member_swap`.

# -----------------------------------------------------------------------------
# SIZE — [XÁC NHẬN — Williams 13/09, "Okay hoàn toàn hợp lý"]
#
# Bối cảnh: Williams muốn height là 1 "dynamic range" chiếm khoảng 60-80%
# chiều dọc màn hình (ví dụ desktop chuẩn 1728×1080, mobile 375×812), và yêu
# cầu Claude đề xuất WIDTH tương ứng. Claude trình bày cách hiểu + đề xuất cụ
# thể, Williams xác nhận toàn bộ ("Okay hoàn toàn hợp lý").
# -----------------------------------------------------------------------------
size:
  height:
    rule: >
      [XÁC NHẬN — Williams 13/09] "dynamic range chiếm khoảng 60-80% kích
      thước chiều dọc 1 màn hình"
    interpretation: >
      [XÁC NHẬN — Williams 13/09, "Okay hoàn toàn hợp lý"] max-height = 80%
      chiều cao viewport (TRẦN CỨNG — Dialog KHÔNG bao giờ cao hơn), height
      thật theo nội dung (content-driven) và cuộn (scroll) bên trong Body nếu
      nội dung vượt trần. 60% là quan sát THỰC TẾ (form vài field tự nhiên
      rơi vào khoảng 60-80%), KHÔNG phải sàn ép buộc — 1 confirmation dialog
      ngắn không bị kéo giãn tới 60%.
    computed_reference_px:
      desktop_1728x1080: {approx_60pct: 648, cap_80pct: 864}
      mobile_375x812:    {approx_60pct: 487, cap_80pct: 650}
      note: "Chỉ là điểm tham chiếu tính từ 2 kích thước màn hình mẫu Williams cho — build bằng đơn vị vh/%, không hardcode px, vì viewport thật của người dùng khác nhau."
  width:
    rule: >
      [XÁC NHẬN — Williams 13/09, "Okay hoàn toàn hợp lý"] KHÔNG scale width
      theo %/vw của viewport (một Dialog rộng 80% ở màn 1728px sẽ ~1382px —
      quá khổ cho form/confirmation thường). Dùng 1 thang WIDTH CỐ ĐỊNH (px),
      chọn theo độ phức tạp nội dung — áp dụng khi render dạng Dialog (trên
      breakpoint chuyển BottomSheet, xem overlay.rules.yaml § OVL-B-04):
        - sm = 400px  — confirmation/AlertDialog, nội dung ngắn, không field nhập liệu
        - md = 480px  — recipe `form` mặc định, vài field Input (khớp gần
          đúng width thật của bản mặc định component gốc — 431px)
        - lg = 640px  — nội dung phức tạp hơn (nhiều field, hoặc nhúng bảng/
          danh sách nhỏ trong Body)
      Dưới breakpoint chuyển BottomSheet: width không áp theo thang này —
      BottomSheet dùng full viewport width (trừ margin an toàn 2 bên, số px
      cụ thể chưa đề xuất — chờ BottomSheet đăng ký component).
    recipe_mapping: "AlertDialog/confirmation → sm; recipe form (mặc định) → md; nội dung phức tạp hơn → lg"
    rationale: "Modal không nên scale tuyến tính theo chiều rộng màn hình rất rộng (khác height, vốn hợp lý scale theo viewport vì nội dung cuộn dọc) — quy ước phổ biến (Material Design...), không phải phát minh riêng."
  status: "[XÁC NHẬN — Williams 13/09] Cả height lẫn width đã duyệt — xem decisions.md § 13/09-B"

