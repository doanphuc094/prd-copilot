  "Xoá":                             {name: trash,                status: "[FIGMA]"}
  "Sửa / chỉnh sửa":                 {name: pen,                  status: "[FIGMA]"}
  "Xuất dữ liệu ra file":            {name: arrow-down-to-line,   status: "[XÁC NHẬN — Williams 07/09]"}
  "Tải mẫu về":                      {name: download,             status: "[XÁC NHẬN — Williams 07/09, chờ import]"}
  "Tải lên / nhập file":             {name: file-arrow-up,        status: "[FIGMA]"}
  "In":                              {name: print,                status: "[XÁC NHẬN — Williams 07/09, chờ import]"}
  "Sao chép":                        {name: copy,                 status: "[XÁC NHẬN — Williams 07/09, chờ import]"}
