      [XÁC NHẬN — Williams 12/09] "Cái đó là tao nói button đúng" — xác nhận
      câu trả lời Fill/Outline/Grey là cho NÚT của Dialog footer, không liên
      quan Alert Style. Đã chuyển thành OVL-B-03 (mức ưu tiên) + OVL-INV-02
      (auto-downgrade 2 nút) ở trên, không còn là dự thảo.
  - item: "ĐÃ ĐÓNG — Node-id thật của 'Dialog / Dialog oragism' trong Figma"
    resolved: >
      [XÁC NHẬN — Williams 12/09] Gửi link kèm node-id 957:16562 (trang
      "Documentation" của Dialog generic) kèm yêu cầu: "Đây là dialog generic
      - tuy nhiên mỗi dialog đều có cấu tạo khác nhau mày cần phải nghiên cứu
      kĩ và đề xuất cho tao". Đã đọc trực tiếp — xem § anatomy.
  - item: "ĐÃ ĐÓNG — OVL-INV-01 áp dụng phạm vi nào"
    resolved: "[XÁC NHẬN — Williams 12/09] Áp cho MỌI Dialog"
  - item: "ĐÃ ĐÓNG — Đề xuất anatomy Header/Body(slot)/Footer + recipe 'form', vòng duyệt của Williams 12/09"
    resolved: >
      [XÁC NHẬN — Williams 12/09] Cả 3 điểm đã duyệt: (1) Footer 2-nút mặc
      định = Secondary Grey + Primary Fill (không phải Outline) — xem §
      anatomy.footer.default_2_button_style; (2) Body là 1 dynamic SLOT, nội
