    Cùng loại instance "Bottom sheet / Bottom sheet device (Base)" xuất hiện
    LẦN NỮA ở cuối mỗi variant (height ~34px) — đại diện safe-area/home-
    indicator của thiết bị, KHÔNG phải margin nội dung có thể chỉnh.
  header: "Header Container#1154:12 (boolean) — bật/tắt header, cấu trúc tương tự Dialog (back/title/close), CHƯA đọc chi tiết property con."
