# -----------------------------------------------------------------------------
# TÊN PROPERTY THẬT TRONG DS
# -----------------------------------------------------------------------------
figma_properties:
  size: Size
  type: Type
  destructive: Destructive
  state: State
  label_visible: "Label#40:0"        # boolean
  error_message_visible: "error message#67:0"  # boolean
  condition: "Condition#725:86"      # boolean — [ĐÃ RÕ 13/09-K] xem sub_parts.condition
  source: "[FIGMA] componentPropertyDefinitions, đọc 12/09"

# -----------------------------------------------------------------------------
# BINDING: SIZE
# -----------------------------------------------------------------------------
size:
  axis_kind: ordered_scale
  scale: [sm, md, lg]
  scale_confirmed: >
    [XÁC NHẬN — Williams 13/09, hỏi lại "input có 3 size=sm/md/lg đúng không"]
    ĐÚNG — 3 giá trị này đọc trực tiếp từ `variantGroupProperties.Size` của
    chính component_set Input thật (componentKey
    `9c400e1d93884025583c2cf3bbcaea263301cde1`, xem component.source ở trên),
    không phải suy đoán — chỉ đúng 3 giá trị [sm, md, lg], không có giá trị
    nào khác trong trục Size.
  source: "[FIGMA]"
  height_px:
    sm: 36
    md: 40
    lg: 44
    source: "[FIGMA — ĐỌC THẬT 13/09-H, 13/09-K] sm: get_variable_defs trên node Input thật (51:211, Size=sm) — biến `Size/size-input-sm` resolve ra 36px. md/lg: đo trực tiếp bounding box của sub-instance \"Input / Input filed type (Base)\" trên màn hình demo Williams đưa (file B2B Portal s2NE6ikwLnsZSUp97RBfof, node 23309:4068, frame \"1. Thiết lập chung\" — 3 hàng SM/MD/LG) — height thật lần lượt 36/40/44px, đúng cấp số cộng +4px mỗi bậc. Không đọc được tên biến `Size/size-input-md`/`Size/size-input-lg` qua get_variable_defs (tool không nhận node id dạng instance-lồng-instance của node này) nhưng số đo bounding box là số THẬT, không suy đoán."
    status: "[ĐÃ ĐÓNG 13/09-K] Cả 3 size đã có số đo px thật: sm=36, md=40, lg=44. Vẫn chưa có mapping nghiệp vụ theo vị trí sử dụng (khác Button đã có policy.size_by_position) — chưa hỏi Williams, không critical."

# -----------------------------------------------------------------------------
# BINDING: TYPE — biến thể cấu trúc field
# -----------------------------------------------------------------------------
type:
  axis_kind: closed_role_set
  values: [Default, Combo, "Leading dropdown", "Trailing dropdown", "w Chips"]
  source: "[FIGMA]"
  status: >
    [cần verify] Ý nghĩa nghiệp vụ + cách các giá trị này khớp với FRMIN-B-02
    (rule icon phải: chevron-down/chevron-up CHỈ khi field là "loại dropdown")
    CHƯA được Williams xác nhận tường minh. Giả thuyết hợp lý (CHƯA áp dụng):
    "Leading dropdown"/"Trailing dropdown" = field có dropdown gắn kèm (vị trí
    icon trái/phải) → đây có thể CHÍNH LÀ điều kiện "field là dropdown" trong
    FRMIN-B-02, nhưng chưa hỏi Williams nên KHÔNG tự map. "Combo" và "w Chips"
    chưa rõ nghĩa hoàn toàn.

# -----------------------------------------------------------------------------
# BINDING: DESTRUCTIVE — trạng thái validation lỗi
# -----------------------------------------------------------------------------
destructive:
  axis_kind: closed_role_set
  values: [True, False]
  meaning: >
    [XÁC NHẬN — Williams 12/09-G, trả lời cho câu hỏi validation của Dialog
    nhưng là cơ chế của chính Input] "mỗi input đều có 1 dạng [Destructive =
    on] thì sẽ hiện báo lỗi nên nếu user nhập sai input nào thì destructive
    bật lên và ghi nội dung báo lỗi bên dưới chính input đó" — True = field
    đang ở trạng thái lỗi, hiện `error message` bên dưới; False = bình thường.
  source: "[FIGMA] + [XÁC NHẬN — Williams, xem decisions.md § 12/09-G]"

# -----------------------------------------------------------------------------
# BINDING: STATE
# -----------------------------------------------------------------------------
state:
  axis_kind: closed_role_set
  values: [Default, Filled, Focused, Disabled]
  meaning:
    Filled: >
      [XÁC NHẬN — Williams 12/09-N, hỏi qua AskUserQuestion] Field ĐANG CÓ GIÁ
      TRỊ — đây là State ánh xạ với "trạng thái pressed" trong rule icon phải
      FRMIN-B-02 (icon "clear" hiện khi State=Filled, KHÔNG phải Focused).
    Default: "[cần verify] Chưa xác nhận icon phải xử lý thế nào ở state này — xem rules/kinds/form_input.rules.yaml § _pending_confirmation"
    Focused: "[cần verify] Không dùng làm điều kiện cho icon 'clear' (đã loại trừ tường minh khỏi Filled ở 12/09-N)"
    Disabled: "[cần verify] Chưa xác nhận icon phải xử lý thế nào ở state này"
  source: "[FIGMA] + [XÁC NHẬN một phần — Williams 12/09-N]"
  color_tokens_by_state:
    status: "[ĐÃ ĐÓNG 13/09-K] Cả 4 tổ hợp đã đọc thật, xem chi tiết dưới. Nguồn: Williams đưa demo thật (file B2B Portal s2NE6ikwLnsZSUp97RBfof, node 23309:3544, frame \"1. Thiết lập chung\" — 3 hàng Focused/Disabled/Destructive), get_variable_defs trên từng instance."
    Filled_False: "border=`border/app/default` (#d4d4d8), nền=`bg/app/baseWhite` (#ffffff) — đọc get_variable_defs trên node 51:211. Xem _shared.binding.yaml § color_tokens.verified_component_bindings.input_state_filled."
    Focused: >
      [XÁC NHẬN — đọc thật 13/09-K] border=`border/info/default` (#3b82f6, xanh dương)
      — LƯU Ý: KHÔNG có 1 token "focus" riêng, dùng chung màu info. Williams giải
      thích thêm: "trạng thái Focused hầu như không dùng khi thiết kế Figma, chỉ
      dùng khi làm prototype HTML cho PO review, và khi họ hover vào vùng input đó"
      — tức trong demo Figma, hàng "Focused" mô phỏng cho hành vi hover/focus THẬT
      sẽ có trong bản HTML, không phải 1 trạng thái Figma hay dùng khi thiết kế UI
      tĩnh.
    Disabled: >
      [XÁC NHẬN — đọc thật 13/09-K] border=`border/app/disabled` (#e4e4e7),
      nền=`bg/app/elevated` (#f4f4f5, KHÔNG phải baseWhite), text=`text/text-disabled`
      (#a1a1aa), icon=`icon/icon-disabled` (#a1a1aa) — đúng như dự đoán kiến trúc
      chung ở 13/09-H, nay đã xác nhận bằng dữ liệu thật thay vì suy đoán.
    "Destructive=True": >
      [XÁC NHẬN — đọc thật 13/09-K] border=`border/error/default` (#ef4444),
      text=`text/text-error` (#ef4444), icon=`icon/icon-error` (#ef4444), nền vẫn
      `bg/app/baseWhite`. Text "Error message" bên dưới field dùng font
      "Content/Body 3" (12/20, Regular) + màu text-error, có icon cảnh báo (triangle)
      đứng trước — kèm màu icon-error.

# -----------------------------------------------------------------------------
# THÀNH PHẦN CON (atoms) — boolean props điều khiển hiện/ẩn
# -----------------------------------------------------------------------------
sub_parts:
  label: "Label#40:0 — hiện/ẩn nhãn field"
  error_message: "error message#67:0 — hiện/ẩn dòng thông báo lỗi (dùng cùng destructive=True, xem trên)"
  condition: >
    Condition#725:86 — [ĐÃ RÕ — Williams 13/09-K] Bật thì hiện 1 hàng "Conditions"
    gồm nhiều chip/tag nhỏ (label + icon check/xmark) ngay dưới field — quan sát
    thật trên node 23309:4072/4329/4483 (file B2B Portal), mỗi hàng có 4 chip
    dạng "Input / Input text type (Base)". Williams xác nhận: "cái condition bên
    dưới vùng input hầu như tao không dùng tới — nên khi tạo input mày có thể
    auto ẩn nó đi giúp tao". → QUY TẮC MỚI: khi dựng field Input mới qua pipeline,
    mặc định Condition=False (ẩn), CHỈ bật khi có yêu cầu tường minh cần hiện dãy
    điều kiện/tag đó.
  source: "[FIGMA] componentPropertyDefinitions, đọc 12/09; ý nghĩa + default xác nhận 13/09-K"

# -----------------------------------------------------------------------------
# ICON — trục icon_slots, luật ở rules/kinds/form_input.rules.yaml (FRMIN-B-01/02)
# -----------------------------------------------------------------------------
icon:
  axis_kind: icon_slots
  slots: [leading, trailing]
  rules_live_at: "rules/kinds/form_input.rules.yaml (FRMIN-B-01 leading, FRMIN-B-02 trailing)"
  glyph_mechanism: >
    Icon glyph được set bằng cách ghi TÊN ligature FA6 trực tiếp vào
    `characters` của TEXT child lồng trong instance "font awesome / Base" (vd
    characters = "chevron-down") — không phải 1 property biến thể riêng.
  verified_examples:
    - field: "Số tiền" (demo render 12/09, sửa 13/09)
      leading: "money-bill — [XÁC NHẬN — Williams 13/09] ĐẠT phép thử FRMIN-B-03 (đoán đúng ra field tiền), giữ nguyên"
      trailing: "circle-xmark (vai 'clear', State=Filled) — [XÁC NHẬN — Williams 13/09] tồn tại thật trong FA6 Pro plugin (Williams tự kiểm tra, xem decisions.md § 13/09-E)."
    - field: "Diễn giải" (demo render 12/09, SỬA 13/09 theo FRMIN-B-03)
      leading: "[ĐÃ BỎ — 13/09] KHÔNG có icon trái nữa. Trước đó là align-left, bỏ theo FRMIN-B-03 (XÁC NHẬN — Williams \"Okay sửa đi\"): align-left chỉ nói chung chung 'đây là ô text', không đoán ra được kiểu dữ liệu cụ thể — xem rules/kinds/form_input.rules.yaml § FRMIN-B-03 và decisions.md § 13/09-E."
      trailing: "circle-xmark (vai 'clear', State=Filled) — [XÁC NHẬN — Williams 13/09] tồn tại thật trong FA6 Pro plugin (Williams tự kiểm tra, xem decisions.md § 13/09-E)."
  source: "[FIGMA] + [XÁC NHẬN — Williams 12/09-N]"

