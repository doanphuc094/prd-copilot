  - item: "Ý nghĩa nghiệp vụ đầy đủ của trục Type (Default/Combo/Leading dropdown/Trailing dropdown/w Chips) — đặc biệt liệu 2 giá trị dropdown có phải chính là điều kiện 'field là dropdown' của FRMIN-B-02 hay không."
  - item: "size.scale (sm/md/lg) — chưa đo px thật, chưa có mapping theo vị trí sử dụng (form ngắn / bảng lọc / v.v.)."
  - item: "Ý nghĩa boolean 'Condition#725:86' — chưa rõ, chưa dùng trong bất kỳ render/recipe nào."
  - item: "Icon phải ở State=Default và State=Disabled — xem rules/kinds/form_input.rules.yaml § _pending_confirmation (chưa hỏi Williams)."
  - item: "Ưu tiên chevron vs clear khi field vừa là dropdown vừa Filled — xem rules/kinds/form_input.rules.yaml § _pending_confirmation (chưa hỏi Williams)."
