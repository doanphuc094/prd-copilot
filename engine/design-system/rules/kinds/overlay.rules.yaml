# =============================================================================
# overlay.rules.yaml — LOẠI: CHIẾM FOCUS, CHẶN NỀN
#
# Thành viên:
#   đang dùng:  (chưa — viết trước khi có binding, xem _pending_confirmation)
#   dự kiến:    Dialog, AlertDialog, BottomSheet, Popover, ContextMenu
#
# Đây là kind ĐỐI LẬP hành vi với feedback_transient (xem block đầu file đó):
# overlay LUÔN có backdrop, chặn thao tác nền, và (trừ Popover/ContextMenu nhẹ)
# thường bẫy focus tới khi người dùng xử lý xong.
#
# TRẠNG THÁI FILE NÀY: [CẬP NHẬT 12/09] Williams đã gửi link kèm node-id thật
# (957:16562 — trang "Documentation" của Dialog generic), yêu cầu "nghiên cứu
# kĩ và đề xuất", rồi DUYỆT đề xuất của Claude. Kết quả: Header (4 phần) +
# Body (dynamic SLOT, không phải anatomy cố định — PRD/designer quyết định
# nội dung) + Footer (2 CTA, mặc định Secondary=Outline màu/Primary=Fill —
# rule auto-downgrade Grey cho 2-nút đã bị RÚT LẠI, xem OVL-INV-02) — xem §
# anatomy. Recipe "form" đã XÁC NHẬN thật. Xem _pending_confirmation.
#
# AlertDialog: tiêu chí kích hoạt đã XÁC NHẬN (12/09, xem § alert_dialog_trigger)
# — modal chặn nền cho thao tác critical, định nghĩa theo NGHIỆP VỤ chứ không
# theo 1 component Figma cụ thể. Binding thật (Figma node, nếu có) vẫn chưa cần
# thiết cho tới khi có màn hình thật cần dùng.
#
# Đọc _core.rules.yaml trước.
# version: 2.0-draft
# =============================================================================

meta:
  kind: overlay
  layer: kind
  portable: true
  version: 2.0-draft
  requires: [_core.rules.yaml]
  requires_axes: [content_pattern]
  status: "[XÁC NHẬN — anatomy Header/Body(slot)/Footer + recipe 'form' đã Williams duyệt 12/09, xem _pending_confirmation]"

undisableable: []

# =============================================================================
# GIỚI HẠN HÀNH VI CỦA LOẠI
# =============================================================================
behavioural_limits:
  - id: OVL-B-01
    rule: "Thành viên của kind này PHẢI có backdrop và chặn thao tác nền, trừ khi profile.policy khai ngoại lệ tường minh cho từng thành viên (vd Popover nhẹ có thể không chặn nền)."
    why: "Đây là ranh giới hành vi phân biệt overlay với feedback_transient."

  - id: OVL-B-02
    rule: "Overlay dùng để bắt buộc xác nhận hành động phá huỷ PHẢI có đúng 2 lối ra: xác nhận và huỷ bỏ — không được chỉ có 1 lối ra (không cho thoát)."
    check: "role == intent.destructive trong CMP-DLG-01 implies count(overlay.exit_actions) >= 2"
    relation_to_composition_rule: "Cụ thể hoá CMP-DLG-01 ở cấp kind — CMP-DLG-01 nói CÓ bước xác nhận, luật này nói bước đó phải cho thoát được."

  - id: OVL-B-03
    rule: >
      Mức độ ưu tiên của các nút trong footer Dialog. Fill (intent Primary,
      emphasis Fill) = tác vụ chính/quan trọng nhất, hoàn thành mục đích chính
      của người dùng. Outline (intent VẪN LÀ Primary — KHÔNG PHẢI Secondary,
      emphasis Outline) = mức mặc định cho vị trí "Secondary CTA" (tên VỊ TRÍ
      trong bảng anatomy Figma, không phải Type), dùng được ở CẢ footer 2 nút
      LẪN làm bậc giữa khi footer có 3 nút. Grey (intent no_path, emphasis vẫn
      Outline — "Grey/Outline") = mức ưu tiên THẤP NHẤT, CHỈ xuất hiện khi
      footer có ĐÚNG 3 nút (nút thứ 3, thấp hơn cả Outline) — KHÔNG áp dụng
      cho footer 2 nút (xem OVL-INV-02, đã RÚT LẠI phần auto-downgrade).
    correction_of_vocab: >
      [XÁC NHẬN — Williams 12/09] Bản trước gọi nút Outline này là "Secondary"
      (Type) — SAI, do Claude lấy nhãn VỊ TRÍ "Secondary CTA" trong bảng
      anatomy Figma rồi tự suy sang Type=Secondary của Button mà KHÔNG kiểm
      property Type thật. Williams sửa: *"Mày gọi nút đó là secondary
      (outline) do mày đang quy ước hay như thế nào? vì tao check định dạng
      nút đó là primary (outline) mà. Secondary (outline) là nút màu xanh"*.
      Claude đọc lại trực tiếp ảnh thật node 773:7518 (Alert, cùng quy ước) —
      cả 2 nút đều màu CAM (không phải xanh), xác nhận đúng: cả nút Fill lẫn
      nút Outline trong pattern 2-nút này đều Type=Primary, chỉ khác Style.
      Type=Secondary (màu xanh) KHÔNG dùng trong pattern này. Xem lỗi cùng
      dạng đã gặp ở 12/09-H (Grey-as-emphasis) — lấy nhãn Figma rồi tự map
      sang Type mà không verify là lỗi lặp lại, cần cẩn thận hơn về sau.
    evidence_2_button: >
      [FIGMA/PRODUCT — Williams gửi ảnh thật 12/09] Màn "Chưa lưu thay đổi":
      footer 2 nút "Huỷ lưu" (Outline, MÀU cam) + "Tiếp tục chỉnh sửa" (Fill
      cam) — cùng 1 họ màu (cam), khớp với Type=Primary cho cả 2 nút, không
      phải Type=Secondary (xanh). Đây là bằng chứng thật cho thấy footer 2 nút
      MẶC ĐỊNH vị trí "Secondary CTA" = Primary+Outline, không tự động chuyển
      Grey — khớp lại với bảng anatomy Figma gốc (§ anatomy.footer), phủ
      quyết rule auto-downgrade đã ghi trước đó.
    references: "Tham khảo rule emphasis + quirk merged_style đã có của Button — rules/kinds/interactive_control.rules.yaml, profile.ghn/ds/button.binding.yaml"
    source: >
      [XÁC NHẬN — Williams 12/09] "Dùng fill cho các tác vụ chính quan trọng,
      giúp hoàn thành mục đích của người dùng. Đối với outline tao muốn sử
      dụng trong trường hợp có 3 nút và nút outline là thao tác tương đương
      gần với fill nhưng mức độ ưu tiên thấp hơn sau đó mức độ ưu tiên thấp
      nhất là grey (Mày có thể tham khảo rule của button)." Xác nhận lại
      12/09 (vòng sau): "Cái đó là tao nói button đúng" — trả lời cho cấu
      hình NÚT của Dialog footer, KHÔNG liên quan tới trục Style (Fill/
      Outline) của chính component Alert (xem rules/components/alert.rules.yaml
      cho câu hỏi đó, trả lời riêng: Alert luôn dùng Outline).

# =============================================================================
# ALERTDIALOG — tiêu chí kích hoạt (NGHIỆP VỤ, không phải theo component Figma)
#
# [XÁC NHẬN — Williams 12/09] AlertDialog = modal cảnh báo, LUÔN chặn nền,
# dùng cho thao tác CRITICAL: có thể HOẶC không thể khôi phục — nếu khôi phục
# được thì hậu quả vẫn phải RẤT NGHIÊM TRỌNG.
#
# Ví dụ thật (Williams cho): kích hoạt bảng giá. Tại thời điểm kích hoạt, đơn
# hàng bắt đầu tính theo bảng giá mới. Nếu bảng giá sai — về mặt kỹ thuật có
# thể sửa lại (khôi phục được) — nhưng đơn hàng đã lên trong lúc bảng giá sai
# vẫn tính sai doanh thu, ảnh hưởng toàn hệ thống.
#
# ⚠️ ĐIỀU NÀY RỘNG HƠN CMP-DLG-01 hiện có (_composition.rules.yaml): CMP-DLG-01
# viết cho vai intent.destructive (mất dữ liệu / không undo được — xem
# action_trigger.rules.yaml § ATRG-T-01). Ví dụ bảng giá KHÔNG mất dữ liệu,
# KHÔNG phải intent.destructive theo định nghĩa hiện tại — nhưng theo Williams
# vẫn cần chặn nền như Dialog xác nhận phá huỷ. Đây là tiêu chí THỨ HAI, tách
# biệt khỏi tiêu chí phá huỷ — xem _pending_confirmation về việc có cần mở rộng
# CMP-DLG-01 hay thêm 1 rule composition mới song song.
# =============================================================================
alert_dialog_trigger:
  decides: "member == AlertDialog"
  axis_kind: closed_role_set
  ask: >
    Hành động này có phải loại CRITICAL không: (a) không thể khôi phục, HOẶC
    (b) khôi phục được nhưng hậu quả nghiêm trọng, ảnh hưởng diện rộng (nhiều
    người dùng / nhiều hệ thống / số liệu tài chính)?
  trigger_confirmed:
    - case: "Không thể khôi phục"
      relation: "Trùng ATRG-T-01 (intent.destructive) — dùng chung với Dialog recipe 'confirmation'"
    - case: "Khôi phục được nhưng hậu quả nghiêm trọng, diện rộng"
      relation: "MỚI — không nằm trong ATRG-T-01 hiện tại, xem _pending_confirmation"
      example: "[XÁC NHẬN — Williams 12/09] Kích hoạt bảng giá sai → đơn hàng tính sai doanh thu toàn hệ thống, dù bảng giá có thể sửa lại được"
  fallback:
    action: escalate
    message: >
      Không xác định được mức độ nghiêm trọng của hậu quả từ tài liệu nghiệp
      vụ. Cần designer/business xác nhận — KHÔNG tự đánh giá "nghiêm trọng"
      bằng trực giác.

# =============================================================================
# ANATOMY — đọc trực tiếp từ trang docs Figma của Dialog generic (12/09)
#
# [FIGMA — node 957:16562 "Documentation", link Williams đưa 12/09] Trang docs
# chính thức của "Dialog / Dialog oragism" (componentKey
# 8b04f4f411eda928c14075725b148bb6a9e5590b) có bảng anatomy tách 3 khối: Header,
# Content, Footer. Đây là cấu trúc CHÍNH THỨC do chính GHN DS ghi tài liệu,
# không phải Claude suy luận — nhưng cách CHIA nó thành content_pattern/recipe
# bên dưới là ĐỀ XUẤT của Claude dựa trên đó, xin Williams duyệt lại (đúng yêu
# cầu "nghiên cứu kĩ và đề xuất").
# =============================================================================
anatomy:
  header:
    source: "[FIGMA] bảng anatomy 'Header', node 1255:1781/1255:1804, đọc 12/09"
    parts:
      - {id: 1, name: "Left icon", instruction: "Show icon"}
      - {id: 2, name: "Header", instruction: "Show header (tiêu đề)"}
      - {id: 3, name: "Content", instruction: "Show content (mô tả)"}
      - {id: 4, name: "Right icon", instruction: "Trigger — nút đóng (X), có thể bấm được"}
    note: "4 phần đều optional theo tên 'Show X' — không có phần nào đánh dấu bắt buộc trong bảng docs."
  body:
    decides: "body.slot_contents"
    axis_kind: dynamic_slot
    source: "[FIGMA] ví dụ 'Edit profile' (COLOR MODE, node 957:16612, và bản đơn 957:16584), đọc 12/09"
    definition: >
      [XÁC NHẬN — Williams 12/09] Body của Dialog là 1 SLOT động (không phải
      anatomy cố định): "Mày có thể tạo một phần slot cho body để customize
      có thể layout các component vào ô slot này để hình thành một nội dung
      hoàn chỉnh." Component nào được ghép vào slot này KHÔNG do rule này quyết
      định — "Đối với component gì để ghép vào dynamic slot này cần define từ
      PRD hoặc designer quyết định." Đây là lý do draft gốc 08/09 nói "Dialog
      không có fixed anatomy": đúng, vì body vốn được THIẾT KẾ để linh hoạt.
    note: >
      Ví dụ minh hoạ chính thức "Edit profile" CHO THẤY 1 cách lấp slot: chứa
      Input organism thật (field "Email" — icon trái, giá trị, nút xoá,
      chevron; anatomy riêng của Input đã có sẵn 8 phần: Left icon/Content/
      Clear icon/Right icon/Focus/Input border/Helper message/Helper icon —
      không phải phát minh mới, chỉ là Input tái dùng bên trong Dialog).
      known_recipes ở content_pattern bên dưới là các cách lấp slot ĐÃ CATALOGUE
      (đã gặp/đã xác nhận), KHÔNG phải danh sách đóng — PRD/designer có thể lấp
      slot bằng tổ hợp component khác miễn là do PRD/designer quyết định tường
      minh, không phải do agent tự suy ra.
    validation_pattern: >
      [XÁC NHẬN — Williams 12/09] Dòng chữ đỏ "EXCLAMATION"/"TRIANGLE-
      EXCLAMATION" trong ví dụ Edit profile ĐÚNG LÀ icon bị vỡ tham chiếu, VÀ
      đúng là có 1 pattern cảnh báo lỗi input thật — nhưng KHÔNG theo cách vẽ
      trong ví dụ docs đó. Cách GHN dùng thật: "mỗi input đều có 1 dạng
      [Destructive = on] thì sẽ hiện báo lỗi nên nếu user nhập sai input nào
      thì destructive bật lên và ghi nội dung báo lỗi bên dưới chính input đó"
      — nghĩa là validation lỗi là STATE của CHÍNH Input organism (bật
      Destructive → hiện Helper message/Helper icon, đã có sẵn trong anatomy
      Input phần 7/8), KHÔNG phải 1 pattern riêng của Dialog. Dialog không cần
      thêm rule validation nào — chỉ cần Input tự xử lý state của nó khi được
      ghép vào slot.
  footer:
    source: "[FIGMA] bảng anatomy 'Footer', node 957:16887/957:16900, đọc 12/09"
    parts:
      - {id: 1, name: "Secondary CTA", instruction: "Trigger"}
      - {id: 2, name: "Primary CTA", instruction: "Trigger"}
    naming_trap: >
      [XÁC NHẬN — Williams 12/09] "Secondary CTA"/"Primary CTA" là tên VỊ TRÍ
      thật trong bảng anatomy Figma (chỉ nói "đây là ô CTA thứ 2/thứ 1"),
      KHÔNG PHẢI tên Type của Button. Bản trước map nhầm "Secondary CTA" sang
      Type=Secondary — SAI. Type thật dùng ở vị trí "Secondary CTA" là
      Primary+Outline (xem OVL-B-03 § correction_of_vocab). Đọc "Secondary
      CTA" = vị trí, không phải Type — giống hệt bẫy "Disabled/Disable" của
      Button (button.binding.yaml § state.naming_trap): nhãn Figma và giá trị
      DS lệch nhau, lớp binding/rule phải tự ghi rõ, không được lẫn.
    note: >
      "Secondary CTA" ↔ nút thứ 2 (Type=Primary+Outline), "Primary CTA" ↔ nút
      thứ 1 (Type=Primary+Fill). ⚠️ Ảnh atom docs gốc (node 957:16887/16900)
      thật ra vẽ nút ở vị trí "Secondary CTA" bằng Grey/Fill (nút nền xám
      nhạt, KHÔNG viền) — đây là ví dụ CŨ/KHÔNG nhất quán, KHÔNG dùng làm chuẩn
      — xem outdated_docs_example bên dưới.
    default_2_button_style: >
      [XÁC NHẬN — Williams 12/09, sau 3 vòng thử-sai] Footer 2-nút mặc định
      của Dialog = vị trí "Secondary CTA" render Type=Primary + emphasis
      Outline (MÀU cam bình thường — KHÔNG phải Type=Secondary/xanh, KHÔNG
      phải Type=Grey) + vị trí "Primary CTA" render Type=Primary + emphasis
      Fill. Ban đầu ghi nhầm 2 lần: (1) auto-downgrade sang Grey/Outline —
      Williams gửi ảnh thật màn "Chưa lưu thay đổi" và yêu cầu bỏ hẳn rule đó
      (xem OVL-INV-02, đã RÚT LẠI); (2) gọi nút Outline là Type=Secondary —
      Williams sửa lại là Type=Primary (xem OVL-B-03 § correction_of_vocab).
      Grey/Outline CHỈ xuất hiện khi footer có ĐÚNG 3 nút (bậc thấp nhất).
    outdated_docs_example: >
      [XÁC NHẬN — Williams 12/09] "Footer button đang được định dạng khác so
      với dạng button của alert dialog. Tao muốn đồng bộ cái này giống rule
      của alert dialog cho consistency" — nút ở vị trí "Secondary CTA" trong
      ảnh atom docs gốc (Grey/Fill, nền xám nhạt không viền) là ví dụ CŨ,
      KHÔNG khớp với quy ước AlertDialog thật (Primary+Outline màu, xem "Chưa
      lưu thay đổi"). Ví dụ "Edit profile" (node 966:17457, dùng cho recipe
      `form`) cũng vẽ theo kiểu Grey/Fill cũ này — kiểm tra lại bằng screenshot
      12/09 xác nhận đúng là ví dụ cũ, không dùng làm chuẩn cho Type/Style.
      Williams xác nhận: bỏ qua các ảnh atom docs gốc này, dùng THỐNG NHẤT 1
      rule cho MỌI Dialog (kể cả AlertDialog) theo default_2_button_style ở
      trên — không có 2 quy ước riêng cho "Dialog thường" và "AlertDialog".

# =============================================================================
# CONTENT PATTERN — cách LẤP SLOT body (xem § anatomy.body.definition: body là
# 1 dynamic slot, KHÔNG phải anatomy cố định — [XÁC NHẬN Williams 12/09]).
# known_recipes dưới đây là các cách lấp slot ĐÃ GẶP/ĐÃ CATALOGUE, không phải
# danh sách đóng — PRD/designer vẫn có thể lấp slot bằng tổ hợp khác.
# =============================================================================
content_pattern:
  decides: content_pattern
  axis_kind: enum
  ask: "Nội dung bên trong slot body này khớp catalogued recipe nào?"
  known_recipes:
    - id: confirmation
      about: "Xác nhận 1 hành động trước khi thực thi — thường đi kèm CMP-DLG-01"
      evidence: "[FIGMA] node 773:12361 / 773:12382 — draft Williams 08/09"
      status: "[XÁC NHẬN — có evidence node, chưa re-verify trực tiếp trong phiên này]"
    - id: form
      about: "Slot body chứa 1 form nhập liệu ngắn (header + mô tả + 1..N field Input + footer 2 CTA)"
      evidence: >
        [FIGMA] Ví dụ chính thức "Edit profile" trong docs Dialog (node
        957:16612, có cả bản Light/Dark; bản đơn ở 957:16584): Header (icon +
        tiêu đề "Edit profile" + nút đóng X) + Content (mô tả "Make changes to
        your profile here. Click save when you're done.") + 2 field "Email"
        (Input organism thật) + Footer (vị trí "Secondary CTA": Type=Primary,
        emphasis Outline; vị trí "Primary CTA": Type=Primary, emphasis Fill —
        theo default_2_button_style ở § anatomy.footer). ⚠️ Lưu ý: ảnh ví dụ
        "Edit profile" THẬT trong docs (node 966:17457) lại vẽ nút vị trí
        "Secondary CTA" theo kiểu Grey/Fill CŨ, không khớp default_2_button_style
        đã chốt — xem § anatomy.footer.outdated_docs_example. Recipe này áp
        dụng cấu trúc (Header/Content/2 field Input/Footer), KHÔNG áp dụng
        màu nút của chính ảnh ví dụ đó.
      validation: "Lỗi input hiển thị qua state riêng của Input (Destructive=on → Helper message/icon) — xem § anatomy.body.validation_pattern. KHÔNG có pattern cảnh báo lỗi riêng ở cấp Dialog."
      status: "[XÁC NHẬN — Williams 12/09] Recipe thật, dùng khi PRD/designer chọn lấp slot body bằng 1..N field Input"
  not_in_table:
    rule: >
      Nội dung không khớp recipe nào đã catalogued KHÔNG tự động là lỗi —
      body là dynamic slot (xem § anatomy.body), PRD/designer có quyền lấp
      slot bằng tổ hợp component khác. Agent KHÔNG tự bịa/suy luận tổ hợp mới
      thay PRD/designer — nếu gặp tổ hợp chưa catalogue, escalate hỏi nguồn
      (PRD hay designer quyết định gì) rồi mới thêm recipe mới vào đây.
    why: "Phân biệt 'chưa catalogue' (bình thường, chờ bổ sung) với 'agent tự suy luận cấu trúc' (không cho phép) — đúng theo cách Williams định nghĩa slot 12/09."

# =============================================================================
# INVARIANTS của loại
# =============================================================================
invariants:
  - id: OVL-INV-01
    rule: "Overlay PHẢI có ít nhất 1 hành động thoát ra tường minh (đóng / huỷ / hoàn thành)."
    check: "count(overlay.exit_actions) >= 1"
