# -----------------------------------------------------------------------------
# TRỤC "Type" — ĐÂY LÀ RECIPE/CONTENT-PATTERN, không phải size/state như Input
# -----------------------------------------------------------------------------
type_variant:
  axis_kind: closed_role_set
  values: ["Action item", "w Textfield", "w Button", "w Illustration", "w Checkbox"]
  source: "[FIGMA] variantGroupProperties, đọc 13/09"
  status: >
    [ĐÃ ĐÓNG 1 PHẦN 13/09-L] Đây là 5 RECIPE nội dung dựng sẵn trong chính
    component Figma (khác Dialog — Dialog không có variant, ráp thủ công qua
    content_pattern recipe ở cấp kind). Ý nghĩa nghiệp vụ đã xác nhận cho 4/5
    recipe (xem business_meaning bên dưới) — còn "w Button" CHƯA hỏi, để ngỏ.
  business_meaning:
    status: "[XÁC NHẬN — Williams 13/09-L, sau khi xem link preview_links_13_09_J]"
    "Action item": "Chưa có usecase thật — hầu như ít dùng tới. Giữ trong hệ thống nhưng KHÔNG có business rule cụ thể để áp — không tự bịa ra usecase."
    "w Textfield": >
      Dùng cho form TẠO MỚI / FILTER (bộ lọc). Phần body là 1 DYNAMIC SLOT —
      nghĩa là designer/agent được TỰ DO customize component Input bên trong
      cho phù hợp với yêu cầu cụ thể của PRD (không phải nội dung cố định 1
      kiểu duy nhất).
    "w Button": "[ĐÃ ĐÓNG 13/09-M] Williams: \"Ý nghĩa nghiệp vụ của button hiện chưa có usecase nào\" — giống Action item, giữ trong hệ thống nhưng KHÔNG có business rule cụ thể để áp."
    "w Illustration": >
      Dùng cho ONBOARDING / trạng thái RỖNG khi chưa có dữ liệu (empty state)
      — hiển thị icon "no-data" màu xám. LƯU Ý: KHÔNG có nút "Skip" (bỏ qua) —
      recipe này không có lối tắt bỏ qua.
    "w Checkbox": >
      Dùng cho lựa chọn FILTER hoặc THÊM KHÁCH HÀNG vào danh sách — tức
      action có thể lặp lại NHIỀU LẦN (chọn nhiều mục liên tiếp), khác Dialog
      xác nhận 1 lần rồi đóng.
  footer_note_13_09_L: >
    [XÁC NHẬN — Williams 13/09-L, tái xác nhận rule đã có] "Lưu ý bottom sheet
    chỉ có 2 nút là primary chỉ khác style filled/outline" — khớp ĐÚNG với
    rule đã chốt ở rules/kinds/overlay.rules.yaml § OVL-B-03 (Fill=Primary/
    Emphasis Fill, Outline=VẪN Primary/Emphasis Outline — không có nút nào
    Type=Secondary). Không cần sửa gì thêm, chỉ ghi nhận để củng cố.
  preview_links_13_09_J: >
    [FIGMA — TẠO INSTANCE THẬT 13/09-J để Williams xem trực quan từng recipe]
    Import lại componentSet + tạo 1 instance/variant trong file TEST
    (uFbbdvWYC1dg3AjdnHCgxk) — link chỉ để XEM (file test, không phải library
    gốc, đừng dùng node id này ở nơi khác):
    - Action item: https://www.figma.com/design/uFbbdvWYC1dg3AjdnHCgxk/Test?node-id=77-373
    - w Textfield: https://www.figma.com/design/uFbbdvWYC1dg3AjdnHCgxk/Test?node-id=77-1355
    - w Button: https://www.figma.com/design/uFbbdvWYC1dg3AjdnHCgxk/Test?node-id=77-467
    - w Illustration: https://www.figma.com/design/uFbbdvWYC1dg3AjdnHCgxk/Test?node-id=77-498
    - w Checkbox: https://www.figma.com/design/uFbbdvWYC1dg3AjdnHCgxk/Test?node-id=77-1592

# -----------------------------------------------------------------------------
# KÍCH THƯỚC — SỐ LIỆU THẬT, đọc trực tiếp cả 5 variant
# -----------------------------------------------------------------------------
size:
  width:
    value: 375
    unit: px
    fixed: true
    source: "[FIGMA — ĐO THẬT] Cả 5/5 variant (Action item, w Button, w Illustration,
      w Textfield, w Checkbox) đều counterAxisSizingMode=FIXED, width=375px —
      KHÔNG có variant nào khác width. 375px trùng khớp CHÍNH XÁC với mobile
      viewport reference Williams cho ở 13/09-A (375x812) — xác nhận
      BottomSheet được thiết kế để chiếm TRỌN chiều rộng màn hình mobile,
      không có margin 2 bên NGOÀI mép sheet."
    status: "[XÁC NHẬN bằng đo đạc thật 13/09 — không cần hỏi lại Williams, đây là số đo trực tiếp từ component]"
  height:
    mode: "AUTO / hug-content"
    observed_range_px: [210, 812]
    observed_variants:
      - {variant: "w Button", height: 210}
      - {variant: "w Textfield", height: 608}
      - {variant: "w Illustration", height: 666}
      - {variant: "Action item", height: 458}
      - {variant: "w Checkbox", height: 812}
    source: "[FIGMA — ĐO THẬT] primaryAxisSizingMode=AUTO trên cả 5 variant — height
      hoàn toàn theo nội dung, KHÔNG có số cố định hay % nào set cứng trong
      component. Variant cao nhất quan sát được (w Checkbox, 812px) trùng
      CHÍNH XÁC với chiều cao viewport mobile reference (375x812) — tức
      BottomSheet thật có thể cao tới TRỌN màn hình khi nội dung nhiều."
    cap:
      value: "80vh"
      status: >
        [XÁC NHẬN — Williams 13/09] "Bottom sheet cũng có cap cứng 80% viewport
        mobile" — ÁP CÙNG max-height cap 80% chiều cao viewport như Dialog
        (xem dialog.binding.yaml § size.height.interpretation). Component gốc
        Figma tự nó KHÔNG có cơ chế cap (chỉ tự nhiên hug tới hết nội dung,
        quan sát thật lên tới 812px = full viewport mobile reference) — cap
        80vh là QUYẾT ĐỊNH THIẾT KẾ áp thêm ở lớp DS/renderer, không phải giá
        trị đọc trực tiếp từ component. Trên 80vh, nội dung cuộn (scroll) bên
        trong sheet, giống cơ chế của Dialog.
    status: >
      [XÁC NHẬN — Williams 13/09] Height AUTO/hug theo nội dung (số đo thật từ
      component), NHƯNG có max-height cap 80vh áp thêm ở lớp DS (xem § cap ở
      trên) — cùng quy tắc với Dialog, đảm bảo consistency giữa 2 dạng overlay
      khi đổi qua lại theo OVL-B-04.

