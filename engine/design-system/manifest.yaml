# -----------------------------------------------------------------------------
# 5 LẰN RANH CHỐNG LẠM DỤNG — compiler kiểm, không phải lời khuyên
# -----------------------------------------------------------------------------
guardrails:
  kind_needs_3_members:
    rule: "Một kind phải có >= 3 thành viên (active + planned) mới hợp lệ"
    severity: warning
    why: "Kind cho 1 component là luật component đội lốt"
  flat_kinds_only:
    rule: "Kind KHÔNG được khai kind cha. Component khai một TẬP kind."
    severity: error
    why: "Cây thừa kế là lúc bắt đầu debug thừa kế thay vì debug thiết kế"
  conflict_is_error:
    rule: "Hai kind cùng khai một rule id với nội dung khác nhau → LỖI CỨNG"
    severity: error
    why: "Xung đột nghĩa là mô hình sai, phải hiện ra chứ không im lặng chọn bên"
  component_file_stays_small:
    rule: "File luật riêng của component > 5 rule → cảnh báo: kind sai"
    severity: warning
    why: "File component phình lên là dấu hiệu kind chưa đúng. Sửa kind, đừng nuôi file component."
  kinds_are_behavioural:
    rule: >
      KHÔNG tạo component_kind vì lý do cấu trúc (vd 'component có 2 slot icon').
      Cấu trúc thuộc axis_kind; component_kind chỉ nói về HÀNH VI.
    severity: manual
    why: "Trộn 2 thứ là cách kiến trúc này mục"
