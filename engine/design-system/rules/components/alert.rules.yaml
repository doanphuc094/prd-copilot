# =============================================================================
# alert.rules.yaml — LUẬT RIÊNG CỦA ALERT
#
# Trục status DÙNG CHUNG với Toast — xem kinds/feedback_transient.rules.yaml.
# File này chỉ giữ thứ riêng của Alert: content_pattern (banner tĩnh, cấu trúc
# khác hẳn Toast) và hành vi không-tự-biến-mất của nó.
#
# version: 2.0-draft
# =============================================================================

meta:
  component: Alert
  layer: component
  version: 2.0-draft
  kinds: [feedback_transient]
  requires: [_core.rules.yaml, kinds/feedback_transient.rules.yaml]
  binding: profile.ghn/ds/alert.binding.yaml
  status: "[XÁC NHẬN — Williams đã xác nhận toàn bộ mục pending qua chat 12/09, xem decisions.md § 12/09-K]"

# =============================================================================
# HÀNH VI — khác biệt cốt lõi với Toast
# =============================================================================
behaviour:
  auto_dismiss: false
  source: "[XÁC NHẬN — Williams 12/09] ảnh 'Có 2 điểm giao không thể xếp tuyến' — banner nằm CỐ ĐỊNH trong layout, không nổi đè, không tự biến mất"
  manual_dismiss: true
  manual_dismiss_source: "[XÁC NHẬN — Williams 12/09] 'có nút đóng thủ công (đây là template alert)' — link file Figma cho, chưa có node-id cụ thể (xem _pending_confirmation)"

# =============================================================================
# CONTENT_PATTERN — trục riêng của Alert
#
# [XÁC NHẬN — Williams 12/09] Giá trị `inline_link` (đã có ở bản trước, dựng
# từ ảnh minh hoạ "Có 2 điểm giao không thể xếp tuyến") ĐÃ BỊ XOÁ khỏi bảng
# này. Quote nguyên văn: "Do trong design system không có mẫu template này,
# nó không thuộc phạm vi template của design system, nên tao muốn remove để
# bám sát theo template mẫu của design system" — nghĩa là ảnh ví dụ đó KHÔNG
# phải 1 template thật tồn tại trong GHN DS, nên không được đưa vào bảng
# catalogue dù trông hợp lý.
#
# [CẬP NHẬT 12/09] recipe `action_row` được thêm sau khi Williams xác nhận
# atom "Alert button container (Base)" (node 773:7518) LÀ use case thật, dùng
# xuyên suốt — xem values/known_recipes bên dưới.
# =============================================================================
content_pattern:
  decides: content_pattern
  axis_kind: enum
  ask: "Nội dung Alert này khớp catalogued recipe nào?"
  values: [action_row]
  known_recipes:
    - id: action_row
      about: "Alert kèm 1 hàng 2 nút hành động — Secondary (Outline, màu bình thường) + Primary (Fill)"
      evidence: "[FIGMA] node 773:7518 'Alert button container (Base)', đọc 12/09 — screenshot thật: 1 hàng ngang 2 nút Outline + Fill cạnh nhau"
      buttons: "Cả 2 nút đều Type=Primary — nút trái (vị trí 'Secondary CTA') = Primary+Outline, nút phải (vị trí 'Primary CTA') = Primary+Fill. KHÔNG dùng Type=Secondary (màu xanh) — xem correction_of_vocab bên dưới."
      source: >
        [XÁC NHẬN — Williams 12/09] "Thì đó giống với nút tao define cho
        alert xuyên suốt mà chỉ không dùng khi có case 3 nút" — quy ước 2-nút
        này dùng XUYÊN SUỐT cho Alert, giống hệt quy ước footer 2-nút mặc
        định của Dialog (xem rules/kinds/overlay.rules.yaml §
        anatomy.footer.default_2_button_style / OVL-B-03) — cùng 1 rule dùng
        chung giữa 2 component, đúng hướng "đồng bộ cho consistency" đã chốt
        ở decisions.md § 12/09-J.
      correction_of_vocab: >
        [XÁC NHẬN — Williams 12/09] Bản đầu ghi nút Outline là "Secondary" —
        SAI. Williams: "Mày gọi nút đó là secondary (outline) do mày đang quy
        ước hay như thế nào? vì tao check định dạng nút đó là primary
        (outline) mà. Secondary (outline) là nút màu xanh". Claude đọc lại
        ảnh thật node 773:7518 — cả 2 nút đều màu CAM, không có nút xanh —
        xác nhận đúng: cả 2 nút đều Type=Primary, chỉ khác Style (Outline vs
        Fill). Xem rules/kinds/overlay.rules.yaml § OVL-B-03.correction_of_vocab
        cho chi tiết đầy đủ (sửa chung cho cả Dialog và Alert).
      not_applicable_when: >
        Alert cần 3 nút — atom này KHÔNG áp dụng, và CHƯA có quy ước riêng
        nào được xác nhận cho trường hợp đó (xem _pending_confirmation, mục
        cuối). KHÔNG tự suy ra theo mẫu 3-nút của Dialog (Fill/Outline/
        Grey-Outline) cho Alert khi chưa có xác nhận riêng.
      status: "[XÁC NHẬN — Williams 12/09] Recipe thật, dùng khi Alert cần hiện hành động (2 nút)"
  status: "[XÁC NHẬN — 1 recipe (action_row) đã xác nhận, xem known_recipes]"
  not_in_table:
    rule: "Cấu trúc nội dung Alert không khớp action_row (vd Alert cần 3 nút, hoặc pattern khác hẳn) phải escalate cho Williams, KHÔNG tự suy ra là hợp lệ, KHÔNG tự phục hồi lại inline_link."

# =============================================================================
# STYLE — trục Fill/Outline riêng của Alert
# =============================================================================
invariants:
  - id: ALERT-INV-01
    rule: "style == Outline luôn luôn — Alert KHÔNG dùng Fill trong thực tế."
    check: "alert.style == 'Outline'"
    source: "[XÁC NHẬN — Williams 12/09] 'Còn alert dialog tất cả dùng dạng outline không dùng fill'"
    note: >
      Figma vẫn có đủ 12 biến thể Type×Style (bao gồm Fill) — xem
      profile.ghn/ds/alert.binding.yaml § style — nhưng Fill KHÔNG có use
      case thật nào, đưa vào excluded (giống cách Button loại Info/Success/
      Warning khỏi intent — xem profile.ghn/policy.yaml § alert.excluded).

# =============================================================================
# rules_live_at — chỉ đường tới luật KHÔNG nằm ở đây
# =============================================================================
rules_live_at:
  status:
    where: kinds/feedback_transient.rules.yaml
    note: "Trục status (success/error xác nhận, phần còn lại chưa xác nhận) dùng chung với Toast"
  behavioural_limits:
    where: kinds/feedback_transient.rules.yaml
    ids: [FBTR-B-01, FBTR-B-02]

# =============================================================================
# _pending_confirmation
# =============================================================================
_pending_confirmation:
  - item: "ĐÃ ĐÓNG — Alert có dismiss thủ công không"
    resolved: "[XÁC NHẬN — Williams 12/09] Có nút đóng thủ công. Cần node-id cụ thể của template để đọc chính xác vị trí/icon nút đóng — Williams mới gửi link file, chưa có node-id (xem cách lấy link đúng ở overlay.rules.yaml § _pending_confirmation, mục Dialog)"
  - item: "ĐÃ ĐÓNG — content_pattern = inline_link có nên xoá không"
    resolved: >
      [XÁC NHẬN — Williams 12/09] "Do trong design system không có mẫu
      template này, nó không thuộc phạm vi template của design system, nên
      tao muốn remove để bám sát theo template mẫu của design system" — ĐÃ
      XOÁ `inline_link` khỏi content_pattern.values (xem § content_pattern
      phía trên). Trục này hiện rỗng cho tới khi có 1 template thật.
  - item: "ĐÃ ĐÓNG — Style Fill vs Outline của Alert"
    resolved: >
      [XÁC NHẬN — Williams 12/09] Câu trả lời dài trước đó (fill/outline/grey
      theo số nút) là cho DIALOG FOOTER, không phải Alert — Williams tự xác
      nhận "Cái đó là tao nói button đúng" (xem rules/kinds/overlay.rules.yaml
      § OVL-B-03/OVL-INV-02). Câu hỏi Style của CHÍNH Alert trả lời riêng, gọn:
      "Còn alert dialog tất cả dùng dạng outline không dùng fill" — Alert LUÔN
      Outline, không dùng Fill. Xem § invariants (ALERT-INV-01) phía trên và
      profile.ghn/ds/alert.binding.yaml § style.
  - item: "ĐÃ ĐÓNG — 'Alert button container (Base)' trong atoms Figma — có use case thật nào Alert thật sự cần nút không"
    resolved: >
      [XÁC NHẬN — Williams 12/09] "Thì đó giống với nút tao define cho alert
      xuyên suốt mà chỉ không dùng khi có case 3 nút" — CÓ use case thật, dùng
      XUYÊN SUỐT: hàng 2 nút Secondary (Outline) + Primary (Fill), cùng quy
      ước với footer 2-nút mặc định của Dialog. Ghi thành recipe `action_row`
      ở § content_pattern phía trên.
    still_open: >
      Trường hợp Alert cần 3 nút — atom `action_row` KHÔNG áp dụng, và CHƯA
      có quy ước riêng nào được xác nhận cho trường hợp đó. KHÔNG tự suy ra
      theo mẫu 3-nút của Dialog (Fill/Outline/Grey-Outline) cho Alert khi
      chưa có xác nhận riêng — hỏi lại Williams nếu gặp màn hình thật cần 3
      nút trên Alert.
