      shape:
        where: _core.rules.yaml § axis_kinds.default_plus_exception
        ids:
          - AX-SHP-01
          - AX-SHP-02
          - AX-SHP-INV-01
        note: >
          Ngữ cảnh cụ thể của ngoại lệ là CHÍNH SÁCH, khai ở profile.<công ty>/policy.yaml §
          shape_exception — không khai ở lớp luật.
      size:
        where: kinds/interactive_control.rules.yaml
        ids:
          - ICTL-Z-01
          - ICTL-Z-02
          - ICTL-Z-05
