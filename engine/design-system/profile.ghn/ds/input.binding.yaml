# -----------------------------------------------------------------------------
# TÊN PROPERTY THẬT TRONG DS
# -----------------------------------------------------------------------------
figma_properties:
  size: Size
  type: Type
  destructive: Destructive
  state: State
  label_visible: "Label#40:0"        # boolean
  error_message_visible: "error message#67:0"  # boolean
  condition: "Condition#725:86"      # boolean — [cần verify] ý nghĩa chưa rõ
  source: "[FIGMA] componentPropertyDefinitions, đọc 12/09"

# -----------------------------------------------------------------------------
# BINDING: SIZE
# -----------------------------------------------------------------------------
size:
  axis_kind: ordered_scale
  scale: [sm, md, lg]
  source: "[FIGMA]"
  status: "[cần verify] Chưa đo px thật (height/padding), chưa có mapping nghiệp vụ theo vị trí — khác Button đã có size.height_px + policy.size_by_position"

# -----------------------------------------------------------------------------
# BINDING: TYPE — biến thể cấu trúc field
# -----------------------------------------------------------------------------
type:
  axis_kind: closed_role_set
  values: [Default, Combo, "Leading dropdown", "Trailing dropdown", "w Chips"]
  source: "[FIGMA]"
  status: >
    [cần verify] Ý nghĩa nghiệp vụ + cách các giá trị này khớp với FRMIN-B-02
    (rule icon phải: chevron-down/chevron-up CHỈ khi field là "loại dropdown")
    CHƯA được Williams xác nhận tường minh. Giả thuyết hợp lý (CHƯA áp dụng):
    "Leading dropdown"/"Trailing dropdown" = field có dropdown gắn kèm (vị trí
    icon trái/phải) → đây có thể CHÍNH LÀ điều kiện "field là dropdown" trong
    FRMIN-B-02, nhưng chưa hỏi Williams nên KHÔNG tự map. "Combo" và "w Chips"
    chưa rõ nghĩa hoàn toàn.

# -----------------------------------------------------------------------------
# BINDING: DESTRUCTIVE — trạng thái validation lỗi
# -----------------------------------------------------------------------------
destructive:
  axis_kind: closed_role_set
  values: [True, False]
  meaning: >
    [XÁC NHẬN — Williams 12/09-G, trả lời cho câu hỏi validation của Dialog
    nhưng là cơ chế của chính Input] "mỗi input đều có 1 dạng [Destructive =
    on] thì sẽ hiện báo lỗi nên nếu user nhập sai input nào thì destructive
    bật lên và ghi nội dung báo lỗi bên dưới chính input đó" — True = field
    đang ở trạng thái lỗi, hiện `error message` bên dưới; False = bình thường.
  source: "[FIGMA] + [XÁC NHẬN — Williams, xem decisions.md § 12/09-G]"

# -----------------------------------------------------------------------------
# BINDING: STATE
# -----------------------------------------------------------------------------
state:
  axis_kind: closed_role_set
  values: [Default, Filled, Focused, Disabled]
  meaning:
    Filled: >
      [XÁC NHẬN — Williams 12/09-N, hỏi qua AskUserQuestion] Field ĐANG CÓ GIÁ
      TRỊ — đây là State ánh xạ với "trạng thái pressed" trong rule icon phải
      FRMIN-B-02 (icon "clear" hiện khi State=Filled, KHÔNG phải Focused).
    Default: "[cần verify] Chưa xác nhận icon phải xử lý thế nào ở state này — xem rules/kinds/form_input.rules.yaml § _pending_confirmation"
    Focused: "[cần verify] Không dùng làm điều kiện cho icon 'clear' (đã loại trừ tường minh khỏi Filled ở 12/09-N)"
    Disabled: "[cần verify] Chưa xác nhận icon phải xử lý thế nào ở state này"
  source: "[FIGMA] + [XÁC NHẬN một phần — Williams 12/09-N]"

# -----------------------------------------------------------------------------
# THÀNH PHẦN CON (atoms) — boolean props điều khiển hiện/ẩn
# -----------------------------------------------------------------------------
sub_parts:
  label: "Label#40:0 — hiện/ẩn nhãn field"
  error_message: "error message#67:0 — hiện/ẩn dòng thông báo lỗi (dùng cùng destructive=True, xem trên)"
  condition: "Condition#725:86 — [cần verify] ý nghĩa chưa rõ, chưa thấy dùng trong bất kỳ recipe/render nào tới nay"
  source: "[FIGMA] componentPropertyDefinitions, đọc 12/09"

# -----------------------------------------------------------------------------
# ICON — trục icon_slots, luật ở rules/kinds/form_input.rules.yaml (FRMIN-B-01/02)
# -----------------------------------------------------------------------------
icon:
  axis_kind: icon_slots
  slots: [leading, trailing]
  rules_live_at: "rules/kinds/form_input.rules.yaml (FRMIN-B-01 leading, FRMIN-B-02 trailing)"
  glyph_mechanism: >
    Icon glyph được set bằng cách ghi TÊN ligature FA6 trực tiếp vào
    `characters` của TEXT child lồng trong instance "font awesome / Base" (vd
    characters = "chevron-down") — không phải 1 property biến thể riêng.
  verified_examples:
    - field: "Số tiền" (demo render 12/09, sửa 13/09)
      leading: "money-bill — [XÁC NHẬN — Williams 13/09] ĐẠT phép thử FRMIN-B-03 (đoán đúng ra field tiền), giữ nguyên"
      trailing: "circle-xmark (vai 'clear', State=Filled) — [XÁC NHẬN — Williams 13/09] tồn tại thật trong FA6 Pro plugin (Williams tự kiểm tra, xem decisions.md § 13/09-E)."
    - field: "Diễn giải" (demo render 12/09, SỬA 13/09 theo FRMIN-B-03)
      leading: "[ĐÃ BỎ — 13/09] KHÔNG có icon trái nữa. Trước đó là align-left, bỏ theo FRMIN-B-03 (XÁC NHẬN — Williams \"Okay sửa đi\"): align-left chỉ nói chung chung 'đây là ô text', không đoán ra được kiểu dữ liệu cụ thể — xem rules/kinds/form_input.rules.yaml § FRMIN-B-03 và decisions.md § 13/09-E."
      trailing: "circle-xmark (vai 'clear', State=Filled) — [XÁC NHẬN — Williams 13/09] tồn tại thật trong FA6 Pro plugin (Williams tự kiểm tra, xem decisions.md § 13/09-E)."
  source: "[FIGMA] + [XÁC NHẬN — Williams 12/09-N]"

